<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELCraft - My City</title>

    <link rel="stylesheet" href="city.css">
</head>

<body>

<div id="city">

    <!-- SKY -->
    <div id="sky">

        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>

        <div id="sun"></div>

    </div>

    <!-- CASTLE -->
    <div id="castle">

        <div class="buildingLabel">
            🏰 Castle
        </div>

    </div>

    <!-- TOP BUILDINGS -->

    <div class="building library" data-world="library">
        <div class="emoji">📚</div>
        <div class="label">Library</div>
    </div>

    <div class="building school" data-world="school">
        <div class="emoji">🏫</div>
        <div class="label">School</div>
    </div>

    <!-- MIDDLE -->

    <div class="building home" data-world="home">
        <div class="emoji">🏠</div>
        <div class="label">Home</div>
    </div>

    <div class="building art" data-world="sky">
        <div class="emoji">🎨</div>
        <div class="label">Art Studio</div>
    </div>

    <!-- BOTTOM -->

    <div class="building market" data-world="market">
        <div class="emoji">🛒</div>
        <div class="label">Market</div>
    </div>

    <div class="building pets" data-world="pets">
        <div class="emoji">🐶</div>
        <div class="label">Pet Shop</div>
    </div>

    <!-- PARK -->

    <div id="park">

        <div class="tree tree1">🌳</div>
        <div class="tree tree2">🌳</div>

        <div id="hero">

            <img
                id="heroAvatar"
                src=""
                alt="Hero">

            <div id="heroName">
                Player
            </div>

        </div>

    </div>

    <!-- ROAD -->

    <div id="road"></div>

    <!-- MESSAGE -->

    <div id="message"></div>

</div>

<script src="city.js"></script>

</body>
</html>
