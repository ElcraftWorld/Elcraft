<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#7259d6">

  <meta
    http-equiv="Cache-Control"
    content="no-store, no-cache, must-revalidate">

  <title>ELCraft — Reset Password</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      place-items: center;

      padding: 20px;

      color: #35415f;
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          145deg,
          #dff5ff,
          #ebe2ff 48%,
          #ffe8f3
        );
    }

    .card {
      width: min(520px, 100%);

      border: 5px solid rgba(255,255,255,.9);
      border-radius: 30px;
      padding: 34px;

      background: rgba(255,255,255,.98);

      box-shadow:
        0 15px 0 rgba(79,58,159,.1),
        0 28px 60px rgba(61,47,112,.2);
    }

    h1 {
      margin: 0;

      color: #4d389f;
      font-size: 34px;
      text-align: center;
    }

    .copy {
      margin: 10px 0 24px;

      color: #747c98;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.5;
      text-align: center;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;

      color: #4d389f;
      font-size: 12px;
      font-weight: 900;
    }

    input {
      width: 100%;
      min-height: 53px;

      border: 3px solid #e4def0;
      border-radius: 15px;
      padding: 11px 14px;

      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #7259d6;
      box-shadow:
        0 0 0 4px rgba(114,89,214,.12);
    }

    button {
      width: 100%;
      min-height: 55px;

      border: 0;
      border-radius: 17px;
      padding: 12px;

      color: white;
      background:
        linear-gradient(
          135deg,
          #7259d6,
          #987cf0
        );

      font: 900 15px Arial, Helvetica, sans-serif;
      cursor: pointer;

      box-shadow:
        0 7px 0 #4d389f;
    }

    button:disabled {
      cursor: wait;
      opacity: .65;
    }

    .message {
      display: none;

      margin-bottom: 16px;
      border-radius: 14px;
      padding: 12px;

      font-size: 12px;
      font-weight: 800;
      line-height: 1.45;
      text-align: center;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #b52b53;
      background: #fff0f5;
    }

    .message.success {
      color: #287342;
      background: #e9f8ed;
    }

    .loading {
      text-align: center;
      color: #4d389f;
      font-weight: 900;
    }
  </style>
</head>

<body>
  <main class="card">

    <h1>
      Create a New Password
    </h1>

    <p class="copy">
      Enter and confirm the password you want to use
      for your ELCraft account.
    </p>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite">
    </div>

    <div
      id="loading"
      class="loading">
      Opening your secure reset link...
    </div>

    <form
      id="form"
      hidden>

      <div class="field">
        <label for="password">
          New password
        </label>

        <input
          id="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required>
      </div>

      <div class="field">
        <label for="confirmation">
          Confirm new password
        </label>

        <input
          id="confirmation"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required>
      </div>

      <button
        id="submitButton"
        type="submit">
        Save New Password
      </button>
    </form>

  </main>

  <script type="module">
    import {
      supabase
    } from "./supabase-client.js";

    import {
      routeSignedInUser
    } from "./auth-router.js";

    const form =
      document.getElementById("form");

    const loading =
      document.getElementById("loading");

    const message =
      document.getElementById("message");

    function showMessage(
      text,
      type
    ) {
      message.textContent =
        text;

      message.className =
        `message show ${type}`;
    }

    async function waitForRecoverySession() {
      const {
        data
      } =
        await supabase.auth.getSession();

      if (data.session?.user) {
        return data.session;
      }

      return await new Promise(
        resolve => {
          const timeout =
            window.setTimeout(
              () => {
                subscription.unsubscribe();
                resolve(null);
              },
              7000
            );

          const {
            data: {
              subscription
            }
          } =
            supabase.auth
              .onAuthStateChange(
                (
                  event,
                  session
                ) => {
                  if (
                    event ===
                      "PASSWORD_RECOVERY" ||
                    session?.user
                  ) {
                    window.clearTimeout(
                      timeout
                    );

                    subscription.unsubscribe();

                    resolve(session);
                  }
                }
              );
        }
      );
    }

    async function initialize() {
      const session =
        await waitForRecoverySession();

      loading.hidden =
        true;

      if (!session?.user) {
        showMessage(
          "This reset link is invalid or expired. Return to the sign-in page and request a new password reset email.",
          "error"
        );

        return;
      }

      form.hidden =
        false;
    }

    form.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        const password =
          document
            .getElementById("password")
            .value
            .trim();

        const confirmation =
          document
            .getElementById("confirmation")
            .value
            .trim();

        if (
          password.length < 8
        ) {
          showMessage(
            "The password must contain at least eight characters.",
            "error"
          );

          return;
        }

        if (
          password !==
          confirmation
        ) {
          showMessage(
            "The two passwords do not match.",
            "error"
          );

          return;
        }

        const button =
          document
            .getElementById("submitButton");

        button.disabled =
          true;

        button.textContent =
          "Saving Password...";

        try {
          const {
            error
          } =
            await supabase.auth
              .updateUser({
                password,

                data: {
                  password_set:
                    true
                }
              });

          if (error) {
            throw error;
          }

          showMessage(
            "Your password was saved. Opening ELCraft...",
            "success"
          );

          window.setTimeout(
            () => {
              routeSignedInUser();
            },
            800
          );

        } catch (error) {
          showMessage(
            error.message ||
            "The password could not be saved.",
            "error"
          );

          button.disabled =
            false;

          button.textContent =
            "Save New Password";
        }
      }
    );

    initialize();
  </script>
</body>
</html>
