<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ELCraft Login</title>

<style>

body{

margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#6ec6ff;

display:flex;
justify-content:center;
align-items:center;

height:100vh;

}

.card{

background:white;

padding:40px;

border-radius:20px;

width:400px;

box-shadow:0 15px 40px rgba(0,0,0,.25);

}

h1{

text-align:center;
color:#4d52c9;

}

input{

width:100%;
padding:14px;
margin-top:12px;

font-size:16px;

border-radius:10px;

border:2px solid #ddd;

box-sizing:border-box;

}

button{

width:100%;

padding:15px;

margin-top:20px;

font-size:18px;

background:#6f62ff;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

}

button:hover{

background:#5a4de5;

}

#message{

margin-top:15px;

font-weight:bold;

text-align:center;

}

</style>

</head>

<body>

<div class="card">

<h1>ELCraft</h1>

<input
id="email"
type="email"
placeholder="Parent Email">

<input
id="password"
type="password"
placeholder="Password">

<button id="login">

Log In

</button>

<button id="signup">

Create Account

</button>

<div id="message"></div>

</div>

<script type="module">

import { supabase } from "./supabase-client.js";

const email=document.getElementById("email");

const password=document.getElementById("password");

const message=document.getElementById("message");

document
.getElementById("signup")
.onclick=async()=>{

const {error}=await supabase.auth.signUp({

email:email.value,

password:password.value

});

if(error){

message.innerHTML=error.message;
message.style.color="red";

return;

}

message.innerHTML="Account created! Check your email.";
message.style.color="green";

};

document
.getElementById("login")
.onclick=async()=>{

const {error}=await supabase.auth.signInWithPassword({

email:email.value,

password:password.value

});

if(error){

message.innerHTML=error.message;
message.style.color="red";

return;

}

window.location.href="index.html";

};

</script>

</body>
</html>
