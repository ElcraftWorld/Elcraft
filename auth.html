<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELCraft Login</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #6ec6ff;
    }

    .card {
      width: 400px;
      max-width: calc(100% - 28px);
      border-radius: 20px;
      padding: 40px;
      background: white;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    h1 {
      color: #4d52c9;
      text-align: center;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 12px;
      border: 2px solid #ddd;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      padding: 15px;
      color: white;
      background: #6f62ff;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover { background: #5a4de5; }
    button:disabled { opacity: .65; cursor: wait; }

    #message {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>ELCraft</h1>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="login" type="button">Log In</button>
    <button id="signup" type="button">Create Account</button>

    <div id="message"></div>
  </div>

  <script type="module">
    import { supabase } from "./supabase-client.js";

    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("login");
    const signupButton = document.getElementById("signup");

    function showMessage(text, type) {
      message.textContent = text;
      message.style.color = type === "success" ? "green" : "red";
    }

    async function sendSignedInUserToCorrectPage() {
      const { data: userData } = await supabase.auth.getUser();

      if (!userData.user) {
        return;
      }

      window.location.replace("parent-dashboard.html");
    }

    signupButton.addEventListener("click", async () => {
      signupButton.disabled = true;
      message.textContent = "";

      const { error } = await supabase.auth.signUp({
        email: email.value.trim(),
        password: password.value
      });

      signupButton.disabled = false;

      if (error) {
        showMessage(error.message, "error");
        return;
      }

      showMessage("Account created! Check your email.", "success");
    });

    loginButton.addEventListener("click", async () => {
      loginButton.disabled = true;
      message.textContent = "";

      const { error } = await supabase.auth.signInWithPassword({
        email: email.value.trim(),
        password: password.value
      });

      if (error) {
        loginButton.disabled = false;
        showMessage(error.message, "error");
        return;
      }

      window.location.href = "parent-dashboard.html";
    });

    sendSignedInUserToCorrectPage();
  </script>
</body>
</html>
