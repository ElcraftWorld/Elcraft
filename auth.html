<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#6ec6ff">

  <title>Parent Login | ELCraft</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;

      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at 20% 15%,
          rgba(255, 255, 255, 0.55),
          transparent 25%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(154, 111, 255, 0.38),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #74d4ff 0%,
          #79baff 45%,
          #a98cff 100%
        );
    }

    button,
    input {
      font: inherit;
    }

    .auth-card {
      width: min(460px, 100%);

      padding: 38px 34px 32px;

      border: 4px solid rgba(255, 255, 255, 0.85);
      border-radius: 32px;

      background: rgba(255, 255, 255, 0.97);

      box-shadow:
        0 24px 60px rgba(43, 54, 130, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .castle {
      display: flex;
      justify-content: center;

      margin-bottom: 8px;

      font-size: 58px;
      line-height: 1;
    }

    h1 {
      margin: 0;

      color: #514bd8;

      font-size: clamp(38px, 8vw, 52px);
      line-height: 1;
      text-align: center;
    }

    .subtitle {
      margin: 12px 0 26px;

      color: #68729c;

      font-size: 16px;
      line-height: 1.45;
      font-weight: 700;
      text-align: center;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;

      margin-bottom: 22px;
      padding: 6px;

      border-radius: 16px;

      background: #eef0ff;
    }

    .tab-button {
      min-height: 46px;

      border: 0;
      border-radius: 12px;

      color: #72789a;
      background: transparent;

      font-weight: 800;

      cursor: pointer;
    }

    .tab-button.active {
      color: #514bd8;
      background: #ffffff;

      box-shadow: 0 5px 14px rgba(58, 52, 155, 0.14);
    }

    .form-panel {
      display: none;
    }

    .form-panel.active {
      display: block;
    }

    label {
      display: block;

      margin: 15px 0 7px;

      color: #353c68;

      font-size: 15px;
      font-weight: 800;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      min-height: 56px;

      border: 2px solid #d8dcef;
      border-radius: 15px;
      padding: 13px 15px;

      color: #303657;
      background: #ffffff;

      font-size: 17px;

      outline: none;
    }

    input:focus {
      border-color: #7569f3;

      box-shadow: 0 0 0 4px rgba(117, 105, 243, 0.14);
    }

    .password-input {
      padding-right: 76px;
    }

    .show-password {
      position: absolute;
      top: 50%;
      right: 12px;

      min-width: 52px;
      min-height: 36px;

      transform: translateY(-50%);

      border: 0;
      border-radius: 9px;

      color: #5e58c9;
      background: #efefff;

      font-size: 13px;
      font-weight: 800;

      cursor: pointer;
    }

    .primary-button {
      width: 100%;
      min-height: 56px;

      margin-top: 22px;

      border: 0;
      border-radius: 16px;
      padding: 14px 18px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #6559f4,
          #8a64ff
        );

      box-shadow: 0 8px 0 #4a43bf;

      font-size: 18px;
      font-weight: 900;

      cursor: pointer;
    }

    .primary-button:hover {
      filter: brightness(1.04);
    }

    .primary-button:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #4a43bf;
    }

    .primary-button:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    .message {
      display: none;

      margin-top: 20px;
      padding: 13px 15px;

      border-radius: 13px;

      font-size: 15px;
      line-height: 1.4;
      font-weight: 800;
      text-align: center;
    }

    .message.error {
      display: block;

      border: 1px solid #f1aaaa;

      color: #a52f3f;
      background: #ffe8ec;
    }

    .message.success {
      display: block;

      border: 1px solid #a6dfb6;

      color: #26703f;
      background: #e7f8eb;
    }

    .message.info {
      display: block;

      border: 1px solid #a9c9ef;

      color: #315e96;
      background: #eaf3ff;
    }

    .parent-note {
      margin-top: 22px;
      padding: 14px;

      border-radius: 14px;

      color: #745e29;
      background: #fff7d9;

      font-size: 13px;
      line-height: 1.45;
      font-weight: 700;
      text-align: center;
    }

    .home-link {
      display: block;

      margin-top: 18px;

      color: #5852cb;

      font-size: 14px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
    }

    @media (max-width: 520px) {
      body {
        padding: 14px;
      }

      .auth-card {
        padding: 30px 22px 26px;
        border-radius: 26px;
      }

      .castle {
        font-size: 48px;
      }
    }
  </style>
</head>

<body>
  <main class="auth-card">

    <div class="castle">🏰</div>

    <h1>ELCraft</h1>

    <p class="subtitle">
      Parent account center
    </p>

    <div class="tabs">
      <button
        id="loginTab"
        class="tab-button active"
        type="button">
        Log In
      </button>

      <button
        id="signupTab"
        class="tab-button"
        type="button">
        Create Account
      </button>
    </div>

    <section
      id="loginPanel"
      class="form-panel active">

      <form id="loginForm">

        <label for="loginEmail">
          Parent email
        </label>

        <input
          id="loginEmail"
          type="email"
          autocomplete="email"
          placeholder="parent@example.com"
          required>

        <label for="loginPassword">
          Password
        </label>

        <div class="input-wrap">
          <input
            id="loginPassword"
            class="password-input"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            minlength="6"
            required>

          <button
            class="show-password"
            type="button"
            data-target="loginPassword">
            Show
          </button>
        </div>

        <button
          id="loginButton"
          class="primary-button"
          type="submit">
          Log In
        </button>

      </form>
    </section>

    <section
      id="signupPanel"
      class="form-panel">

      <form id="signupForm">

        <label for="parentName">
          Parent name
        </label>

        <input
          id="parentName"
          type="text"
          autocomplete="name"
          maxlength="80"
          placeholder="Your name"
          required>

        <label for="signupEmail">
          Parent email
        </label>

        <input
          id="signupEmail"
          type="email"
          autocomplete="email"
          placeholder="parent@example.com"
          required>

        <label for="signupPassword">
          Create password
        </label>

        <div class="input-wrap">
          <input
            id="signupPassword"
            class="password-input"
            type="password"
            autocomplete="new-password"
            placeholder="At least 6 characters"
            minlength="6"
            required>

          <button
            class="show-password"
            type="button"
            data-target="signupPassword">
            Show
          </button>
        </div>

        <label for="confirmPassword">
          Confirm password
        </label>

        <div class="input-wrap">
          <input
            id="confirmPassword"
            class="password-input"
            type="password"
            autocomplete="new-password"
            placeholder="Enter the password again"
            minlength="6"
            required>

          <button
            class="show-password"
            type="button"
            data-target="confirmPassword">
            Show
          </button>
        </div>

        <button
          id="signupButton"
          class="primary-button"
          type="submit">
          Create Parent Account
        </button>

      </form>
    </section>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite">
    </div>

    <div class="parent-note">
      🔒 Parent accounts control child profiles, family connections
      and safety approvals.
    </div>

    <a
      class="home-link"
      href="index.html">
      ← Return to ELCraft
    </a>

  </main>

  <script type="module">
    import { supabase } from "./supabase-client.js";

    const loginTab =
      document.getElementById("loginTab");

    const signupTab =
      document.getElementById("signupTab");

    const loginPanel =
      document.getElementById("loginPanel");

    const signupPanel =
      document.getElementById("signupPanel");

    const loginForm =
      document.getElementById("loginForm");

    const signupForm =
      document.getElementById("signupForm");

    const loginButton =
      document.getElementById("loginButton");

    const signupButton =
      document.getElementById("signupButton");

    const message =
      document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function showLoginPanel() {
      clearMessage();

      loginTab.classList.add("active");
      signupTab.classList.remove("active");

      loginPanel.classList.add("active");
      signupPanel.classList.remove("active");
    }

    function showSignupPanel() {
      clearMessage();

      signupTab.classList.add("active");
      loginTab.classList.remove("active");

      signupPanel.classList.add("active");
      loginPanel.classList.remove("active");
    }

    loginTab.addEventListener(
      "click",
      showLoginPanel
    );

    signupTab.addEventListener(
      "click",
      showSignupPanel
    );

    document
      .querySelectorAll(".show-password")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const input =
              document.getElementById(
                button.dataset.target
              );

            const isHidden =
              input.type === "password";

            input.type =
              isHidden ? "text" : "password";

            button.textContent =
              isHidden ? "Hide" : "Show";
          }
        );
      });

    loginForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();
        clearMessage();

        const email =
          document
            .getElementById("loginEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("loginPassword")
            .value;

        if (!email) {
          showMessage(
            "Please enter your email address.",
            "error"
          );

          return;
        }

        if (!password) {
          showMessage(
            "Please enter your password.",
            "error"
          );

          return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        try {
          const { data, error } =
            await supabase.auth.signInWithPassword({
              email,
              password
            });

          if (error) {
            throw error;
          }

          if (!data.session) {
            throw new Error(
              "No login session was created."
            );
          }

          showMessage(
            "Login successful! Opening ELCraft...",
            "success"
          );

          setTimeout(() => {
            window.location.href = "index.html";
          }, 800);

        } catch (error) {
          console.error(
            "Login error:",
            error
          );

          showMessage(
            error?.message ||
              "Unable to log in. Please try again.",
            "error"
          );

        } finally {
          loginButton.disabled = false;
          loginButton.textContent = "Log In";
        }
      }
    );

    signupForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();
        clearMessage();

        const name =
          document
            .getElementById("parentName")
            .value
            .trim();

        const email =
          document
            .getElementById("signupEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("signupPassword")
            .value;

        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;

        if (!name) {
          showMessage(
            "Please enter the parent name.",
            "error"
          );

          return;
        }

        if (!email) {
          showMessage(
            "Please enter the parent email address.",
            "error"
          );

          return;
        }

        if (!password) {
          showMessage(
            "Please create a password.",
            "error"
          );

          return;
        }

        if (password.length < 6) {
          showMessage(
            "Your password must contain at least 6 characters.",
            "error"
          );

          return;
        }

        if (password !== confirmPassword) {
          showMessage(
            "The passwords do not match.",
            "error"
          );

          return;
        }

        signupButton.disabled = true;
        signupButton.textContent =
          "Creating account...";

        try {
          const { data, error } =
            await supabase.auth.signUp({
              email,
              password,
              options: {
                data: {
                  name
                }
              }
            });

          if (error) {
            throw error;
          }

          if (!data.user) {
            throw new Error(
              "Supabase did not create the account."
            );
          }

          if (data.session) {
            showMessage(
              "Account created! Opening ELCraft...",
              "success"
            );

            setTimeout(() => {
              window.location.href = "index.html";
            }, 900);

            return;
          }

          showMessage(
            "Account created! Check your email and click the confirmation link, then return here to log in.",
            "success"
          );

          signupForm.reset();

        } catch (error) {
          console.error(
            "Signup error:",
            error
          );

          showMessage(
            error?.message ||
              "Unable to create the account. Please try again.",
            "error"
          );

        } finally {
          signupButton.disabled = false;
          signupButton.textContent =
            "Create Parent Account";
        }
      }
    );

    async function checkExistingSession() {
      try {
        const { data, error } =
          await supabase.auth.getSession();

        if (error) {
          console.error(
            "Session check error:",
            error
          );

          return;
        }

        if (data.session) {
          showMessage(
            `You are already logged in as ${data.session.user.email}.`,
            "info"
          );
        }

      } catch (error) {
        console.error(
          "Unexpected session error:",
          error
        );
      }
    }

    checkExistingSession();
  </script>
</body>
</html>
