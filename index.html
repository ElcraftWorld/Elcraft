<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1d5ca8">

  <title>ELCraft</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #1d5ca8;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #1d5ca8;
      font-family: Arial, Helvetica, sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    img {
      -webkit-user-drag: none;
      user-select: none;
    }

    .screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);

      background:
        radial-gradient(
          circle at 50% 35%,
          #6dc8f5 0%,
          #318dde 45%,
          #184f9d 100%
        );
    }

    .frame {
      position: relative;
      flex: 0 0 auto;

      width: min(
        100%,
        calc(
          (
            100dvh -
            env(safe-area-inset-top) -
            env(safe-area-inset-bottom)
          ) * 1.5
        )
      );

      height: min(
        calc(
          100dvh -
          env(safe-area-inset-top) -
          env(safe-area-inset-bottom)
        ),
        calc(
          (
            100vw -
            env(safe-area-inset-left) -
            env(safe-area-inset-right)
          ) / 1.5
        )
      );

      max-width: 100%;
      max-height: 100%;

      aspect-ratio: 3 / 2;

      background:
        url('a_bright_colorful_cartoony_3d_game_app_home_scre.png')
        center / contain
        no-repeat;

      isolation: isolate;
      overflow: hidden;
    }

    .profile-text {
      position: absolute;
      left: 77.15%;
      top: 3.4%;
      width: 8.6%;
      height: 7.2%;
      z-index: 3;

      display: flex;
      flex-direction: column;
      justify-content: center;

      color: #5d43a2;
      pointer-events: none;
    }

    .profile-text strong {
      max-width: 100%;
      overflow: hidden;

      font-size: clamp(8px, 1.45vw, 24px);
      line-height: 1;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .profile-text span {
      margin-top: 4px;

      font-size: clamp(6px, 0.8vw, 13px);
      font-weight: 700;
      line-height: 1;
    }

    .greeting {
      position: absolute;
      left: 62.9%;
      top: 29.6%;
      width: 20.4%;
      height: 17.5%;
      z-index: 3;

      color: #5f43a4;
      pointer-events: none;
    }

    .greeting h1 {
      margin: 0;

      font-size: clamp(14px, 3vw, 50px);
      line-height: 1.02;
      font-weight: 900;
      white-space: nowrap;
    }

    .greeting p {
      width: 92%;
      margin: 10px 0 0;

      color: #173b78;
      font-size: clamp(8px, 1.35vw, 22px);
      line-height: 1.35;
      font-weight: 800;
    }

    .owner {
      position: absolute;
      left: 64.2%;
      top: 51.2%;
      width: 17.4%;
      height: 4.3%;
      z-index: 3;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 10px;
      overflow: hidden;

      color: #6046a3;
      font-size: clamp(6px, 0.95vw, 16px);
      font-weight: 800;
      white-space: nowrap;
      text-overflow: ellipsis;

      pointer-events: none;
    }

    .owner span {
      max-width: 68%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scene-avatar {
      position: absolute;
      left: 48.5%;
      bottom: 24.2%;
      z-index: 3;

      display: none;
      width: 16%;
      aspect-ratio: 1 / 1.35;

      transform: translateX(-50%);
      object-fit: contain;

      pointer-events: none;
      filter: drop-shadow(0 12px 10px rgba(24, 30, 74, 0.2));
    }

    .profile-avatar {
      position: absolute;
      left: 72.25%;
      top: 3.05%;
      z-index: 4;

      display: none;
      width: 5.15%;
      aspect-ratio: 1;

      border-radius: 50%;
      object-fit: cover;

      pointer-events: none;
    }

    .hotspot {
      position: absolute;
      z-index: 5;

      min-width: 32px;
      min-height: 32px;

      border: 0;
      border-radius: 24px;
      padding: 0;

      background: transparent;
      cursor: pointer;

      -webkit-appearance: none;
      appearance: none;
    }

    .hotspot:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .hotspot:active {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(0.98);
    }

    .hotspot:focus-visible {
      outline: 5px solid rgba(255, 255, 255, 0.95);
      outline-offset: 2px;
    }

    .profiles {
      left: 86.5%;
      top: 3.2%;
      width: 6.5%;
      height: 7.2%;
    }

    .settings {
      left: 94.1%;
      top: 2.8%;
      width: 4.3%;
      height: 7.5%;
      border-radius: 50%;
    }

    .gift {
      left: 0.7%;
      top: 86.2%;
      width: 6.5%;
      height: 11.2%;
    }

    .sky {
      left: 8.7%;
      top: 75.1%;
      width: 15%;
      height: 22%;
    }

    .characters {
      left: 24.9%;
      top: 75.1%;
      width: 15%;
      height: 22%;
    }

    .city {
      left: 41.1%;
      top: 75.1%;
      width: 15%;
      height: 22%;
    }

    .music {
      left: 57.2%;
      top: 75.1%;
      width: 15%;
      height: 22%;
    }

    .together {
      left: 73.5%;
      top: 75.1%;
      width: 15%;
      height: 22%;
    }

    .map {
      left: 91.6%;
      top: 86.2%;
      width: 6.5%;
      height: 11.2%;
    }

    .name-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: none;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      padding:
        calc(20px + env(safe-area-inset-top))
        calc(20px + env(safe-area-inset-right))
        calc(20px + env(safe-area-inset-bottom))
        calc(20px + env(safe-area-inset-left));

      overflow-y: auto;

      background: rgba(27, 31, 78, 0.58);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);

      overscroll-behavior: contain;
    }

    .name-modal.open {
      display: flex;
    }

    .name-card {
      width: min(520px, 92vw);
      max-height: calc(100dvh - 40px);
      overflow-y: auto;

      border: 3px solid rgba(255, 255, 255, 0.95);
      border-radius: 32px;
      padding: 28px;

      background: #fffaf3;
      box-shadow: 0 24px 70px rgba(14, 20, 63, 0.4);

      text-align: center;
    }

    .name-card h1 {
      margin: 0;

      color: #6546ad;
      font-size: clamp(30px, 6vw, 48px);
      line-height: 1.1;
    }

    .name-card p {
      margin: 18px 0;

      color: #273769;
      font-size: 18px;
      line-height: 1.4;
      font-weight: 700;
    }

    .name-card input {
      width: 100%;
      min-height: 54px;

      border: 2px solid #d9caef;
      border-radius: 17px;
      padding: 14px 16px;

      color: #303762;
      background: #fff;

      font-size: 20px;
      text-align: center;

      appearance: none;
      -webkit-appearance: none;
    }

    .name-card input:focus {
      border-color: #8669ce;
      outline: 4px solid rgba(134, 105, 206, 0.18);
    }

    .name-card button {
      width: 100%;
      min-height: 54px;
      margin-top: 14px;

      border: 0;
      border-radius: 17px;
      padding: 14px 18px;

      color: #fff;
      background: #74bd32;
      box-shadow: 0 6px 0 #4c8f1e;

      font-size: 20px;
      font-weight: 900;

      cursor: pointer;
      touch-action: manipulation;
    }

    .name-card button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #4c8f1e;
    }

    .error {
      min-height: 20px;
      margin-top: 12px;

      color: #b13e55;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: calc(20px + env(safe-area-inset-top));
      z-index: 1100;

      width: max-content;
      max-width: min(90vw, 560px);
      padding: 12px 20px;

      transform: translateX(-50%) translateY(-130px);

      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;

      color: #5c3ca1;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);

      font-size: clamp(14px, 2vw, 18px);
      line-height: 1.3;
      font-weight: 800;
      text-align: center;

      opacity: 0;
      pointer-events: none;

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* iPad portrait */
    @media
      (min-width: 700px)
      and (max-width: 1100px)
      and (orientation: portrait) {

      .screen {
        align-items: center;
        justify-content: center;
      }

      .frame {
        width: min(
          calc(
            100vw -
            env(safe-area-inset-left) -
            env(safe-area-inset-right)
          ),
          calc(
            (
              100dvh -
              env(safe-area-inset-top) -
              env(safe-area-inset-bottom)
            ) * 1.5
          )
        );

        height: auto;
        aspect-ratio: 3 / 2;
      }

      .hotspot {
        min-width: 44px;
        min-height: 44px;
      }

      .profile-text strong {
        font-size: clamp(10px, 1.55vw, 18px);
      }

      .profile-text span {
        font-size: clamp(7px, 0.9vw, 11px);
      }

      .greeting h1 {
        font-size: clamp(20px, 3.2vw, 38px);
      }

      .greeting p {
        margin-top: 7px;
        font-size: clamp(10px, 1.45vw, 17px);
      }

      .owner {
        font-size: clamp(7px, 1vw, 12px);
      }

      .name-card {
        width: min(540px, 88vw);
        padding: 34px;
      }

      .name-card input,
      .name-card button {
        min-height: 58px;
      }
    }

    /* iPad landscape */
    @media
      (min-width: 900px)
      and (max-width: 1400px)
      and (orientation: landscape) {

      .frame {
        width: min(
          calc(
            100vw -
            env(safe-area-inset-left) -
            env(safe-area-inset-right)
          ),
          calc(
            (
              100dvh -
              env(safe-area-inset-top) -
              env(safe-area-inset-bottom)
            ) * 1.5
          )
        );

        height: min(
          calc(
            100dvh -
            env(safe-area-inset-top) -
            env(safe-area-inset-bottom)
          ),
          calc(
            (
              100vw -
              env(safe-area-inset-left) -
              env(safe-area-inset-right)
            ) / 1.5
          )
        );
      }

      .hotspot {
        min-width: 44px;
        min-height: 44px;
      }

      .toast {
        top: calc(16px + env(safe-area-inset-top));
      }
    }

    /* Short landscape screens, including iPad split view */
    @media
      (max-height: 650px)
      and (orientation: landscape) {

      .name-modal {
        align-items: flex-start;
      }

      .name-card {
        margin: auto;
        padding: 22px;
        border-radius: 26px;
      }

      .name-card h1 {
        font-size: clamp(28px, 5vw, 42px);
      }

      .name-card p {
        margin: 12px 0;
        font-size: 16px;
      }

      .name-card input,
      .name-card button {
        min-height: 48px;
        padding: 11px 14px;
        font-size: 18px;
      }
    }

    /* Small portrait support */
    @media
      (max-width: 699px)
      and (orientation: portrait) {

      .frame {
        width: calc(
          100vw -
          env(safe-area-inset-left) -
          env(safe-area-inset-right)
        );

        height: auto;
        aspect-ratio: 3 / 2;
      }

      .hotspot {
        min-width: 32px;
        min-height: 32px;
      }

      .name-card {
        width: 94vw;
        padding: 22px;
        border-radius: 26px;
      }

      .name-card h1 {
        font-size: 32px;
      }

      .name-card p {
        font-size: 16px;
      }

      .toast {
        top: calc(12px + env(safe-area-inset-top));
        max-width: 88vw;
        border-radius: 22px;
        padding: 11px 16px;
      }
    }

    @media (hover: none) and (pointer: coarse) {
      .hotspot:hover {
        background: transparent;
      }

      .hotspot:active {
        background: rgba(255, 255, 255, 0.13);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .toast {
        transition: none;
      }

      .hotspot:active,
      .name-card button:active {
        transform: none;
      }
    }
  </style>
</head>

<body>

  <main class="screen">

    <div
      class="frame"
      aria-label="ELCraft Home World">

      <div class="profile-text">
        <strong id="profileName">Player</strong>
        <span>Level 1</span>
      </div>

      <div class="greeting">
        <h1>
          Hi <span id="greetingName">Player</span>! ✨
        </h1>

        <p>
          Ready to create something amazing today?
        </p>
      </div>

      <div class="owner">
        🔒 This world belongs to&nbsp;<span id="ownerName">Player</span>
      </div>

      <img
        id="profileAvatar"
        class="profile-avatar"
        alt="Player profile avatar"
        draggable="false">

      <img
        id="sceneAvatar"
        class="scene-avatar"
        alt="Player avatar"
        draggable="false">

      <button
        class="hotspot profiles"
        data-label="Profiles"
        aria-label="Profiles"
        type="button">
      </button>

      <button
        class="hotspot settings"
        data-label="Settings"
        aria-label="Settings"
        type="button">
      </button>

      <button
        class="hotspot gift"
        data-label="Daily Gift"
        aria-label="Daily Gift"
        type="button">
      </button>

      <button
        class="hotspot sky"
        data-label="Sky World"
        aria-label="Sky World"
        type="button">
      </button>

      <button
        class="hotspot characters"
        data-label="My Characters"
        aria-label="My Characters"
        type="button">
      </button>

      <button
        class="hotspot city"
        data-label="My City"
        aria-label="My City"
        type="button">
      </button>

      <button
        class="hotspot music"
        data-label="Music"
        aria-label="Music"
        type="button">
      </button>

      <button
        class="hotspot together"
        data-label="Together"
        aria-label="Together"
        type="button">
      </button>

      <button
        class="hotspot map"
        data-label="Map"
        aria-label="Map"
        type="button">
      </button>

    </div>

    <div
      class="toast"
      id="toast"
      role="status"
      aria-live="polite">
    </div>

  </main>

  <div
    class="name-modal"
    id="nameModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="nameTitle">

    <section class="name-card">

      <h1 id="nameTitle">
        Welcome to ELCraft! ✨
      </h1>

      <p>
        What should we call you in your world?
      </p>

      <input
        id="nameInput"
        maxlength="20"
        autocomplete="given-name"
        enterkeyhint="done"
        inputmode="text"
        placeholder="Type your first name">

      <button
        id="saveName"
        type="button">
        Enter My World
      </button>

      <div
        class="error"
        id="nameError"
        aria-live="polite">
      </div>

    </section>

  </div>

  <script>
    (() => {
      'use strict';

      const NAME_KEY = 'elcraft_child_name';
      const AVATAR_KEY = 'elcraft_avatar_image';

      const profileName =
        document.getElementById('profileName');

      const greetingName =
        document.getElementById('greetingName');

      const ownerName =
        document.getElementById('ownerName');

      const profileAvatar =
        document.getElementById('profileAvatar');

      const sceneAvatar =
        document.getElementById('sceneAvatar');

      const modal =
        document.getElementById('nameModal');

      const input =
        document.getElementById('nameInput');

      const error =
        document.getElementById('nameError');

      const toast =
        document.getElementById('toast');

      const saveNameButton =
        document.getElementById('saveName');

      let toastTimer = null;

      function cleanName(value) {
        return String(value || '')
          .trim()
          .replace(/\s+/g, ' ')
          .slice(0, 20);
      }

      function getSavedName() {
        return cleanName(
          localStorage.getItem(NAME_KEY)
        );
      }

      function applyName(name) {
        const safeName =
          cleanName(name) || 'Player';

        profileName.textContent = safeName;
        greetingName.textContent = safeName;
        ownerName.textContent = safeName;

        document.title =
          `ELCraft — ${safeName}'s World`;
      }

      function hideAvatar() {
        profileAvatar.style.display = 'none';
        sceneAvatar.style.display = 'none';

        profileAvatar.removeAttribute('src');
        sceneAvatar.removeAttribute('src');
      }

      function applyAvatar() {
        const avatar =
          localStorage.getItem(AVATAR_KEY);

        if (!avatar) {
          hideAvatar();
          return;
        }

        profileAvatar.onload = () => {
          profileAvatar.style.display = 'block';
        };

        sceneAvatar.onload = () => {
          sceneAvatar.style.display = 'block';
        };

        profileAvatar.onerror = hideAvatar;
        sceneAvatar.onerror = hideAvatar;

        profileAvatar.src = avatar;
        sceneAvatar.src = avatar;
      }

      function openNamePrompt() {
        modal.classList.add('open');

        document.body.style.overflow = 'hidden';

        setTimeout(() => {
          input.focus({
            preventScroll: true
          });

          input.select();
        }, 150);
      }

      function closeNamePrompt() {
        modal.classList.remove('open');
        document.body.style.overflow = '';
        input.blur();
      }

      function saveName() {
        const name =
          cleanName(input.value);

        if (!name) {
          error.textContent =
            'Please enter a name.';

          input.focus({
            preventScroll: true
          });

          return;
        }

        localStorage.setItem(
          NAME_KEY,
          name
        );

        error.textContent = '';

        applyName(name);
        closeNamePrompt();
      }

      function showComingSoon(label) {
        const name =
          getSavedName() || 'Player';

        toast.textContent =
          `${label} is coming soon for ${name}! ✨`;

        toast.classList.add('show');

        clearTimeout(toastTimer);

        toastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, 1800);
      }

      function navigateTo(page) {
        window.location.href = page;
      }

      function addTapAction(selector, action) {
        const element =
          document.querySelector(selector);

        if (!element) {
          return;
        }

        element.addEventListener(
          'click',
          action
        );
      }

      const savedName = getSavedName();

      if (savedName) {
        applyName(savedName);
      } else {
        applyName('Player');
        openNamePrompt();
      }

      applyAvatar();

      saveNameButton.addEventListener(
        'click',
        saveName
      );

      input.addEventListener(
        'input',
        () => {
          error.textContent = '';
        }
      );

      input.addEventListener(
        'keydown',
        event => {
          if (event.key === 'Enter') {
            event.preventDefault();
            saveName();
          }
        }
      );

      addTapAction(
        '.profiles',
        () => {
          input.value =
            getSavedName();

          error.textContent = '';

          openNamePrompt();
        }
      );

      addTapAction(
        '.sky',
        () => {
          navigateTo('sky-world.html');
        }
      );

      addTapAction(
        '.characters',
        () => {
          navigateTo('my-character.html');
        }
      );

      addTapAction(
        '.city',
        () => {
          navigateTo('my-city.html');
        }
      );

      addTapAction(
        '.music',
        () => {
          navigateTo('music.html');
        }
      );

      document
        .querySelectorAll(
          '.hotspot:not(.profiles):not(.sky):not(.characters):not(.city):not(.music)'
        )
        .forEach(button => {
          button.addEventListener(
            'click',
            () => {
              showComingSoon(
                button.dataset.label
              );
            }
          );
        });

      window.addEventListener(
        'storage',
        event => {
          if (event.key === NAME_KEY) {
            applyName(
              getSavedName() || 'Player'
            );
          }

          if (event.key === AVATAR_KEY) {
            applyAvatar();
          }
        }
      );

      window.addEventListener(
        'pageshow',
        () => {
          applyName(
            getSavedName() || 'Player'
          );

          applyAvatar();
        }
      );

      document.addEventListener(
        'touchmove',
        event => {
          if (
            !event.target.closest(
              '.name-card'
            )
          ) {
            event.preventDefault();
          }
        },
        {
          passive: false
        }
      );
    })();
  </script>

</body>
</html>
