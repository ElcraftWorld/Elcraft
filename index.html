<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELCraft</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1d5ca8}
  body{font-family:Arial,sans-serif}
  button,input{font:inherit}

  .screen{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 35%,#6dc8f5 0%,#318dde 45%,#184f9d 100%);
  }
  .frame{
    position:relative;
    width:min(100vw,calc(100vh * 1.5));
    height:min(100vh,calc(100vw / 1.5));
    flex:0 0 auto;
    background:url('a_bright_colorful_high_detail_3d_illustrated_kid.png') center/contain no-repeat;
  }

  /* Dynamic name covers — these only replace the fixed Ella text in the artwork. */
  .profile-name-cover{
    position:absolute;
    left:76.3%;
    top:3.4%;
    width:8.2%;
    height:6.2%;
    border-radius:18px;
    background:#fffaf4;
    display:flex;
    align-items:center;
    padding-left:1.1%;
    color:#5f43a3;
    font-weight:800;
    font-size:clamp(10px,1.35vw,24px);
    line-height:1;
    z-index:3;
    pointer-events:none;
  }
  .profile-name-cover small{
    display:block;
    margin-top:3px;
    font-size:.58em;
    color:#705d9d;
  }

  .greeting-name-cover{
    position:absolute;
    left:62.8%;
    top:29.4%;
    width:18.8%;
    height:8.2%;
    border-radius:14px;
    background:#fffaf3;
    display:flex;
    align-items:center;
    padding-left:1.1%;
    color:#6848ad;
    font-weight:800;
    font-size:clamp(15px,3vw,49px);
    line-height:1;
    z-index:3;
    pointer-events:none;
  }

  .owner-cover{
    position:absolute;
    left:63.6%;
    top:45.0%;
    width:17.2%;
    height:5.3%;
    border-radius:999px;
    background:#efe3ff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#6546a6;
    font-weight:700;
    font-size:clamp(7px,1vw,17px);
    z-index:3;
    pointer-events:none;
  }

  .hotspot{
    position:absolute;
    border:0;
    background:transparent;
    cursor:pointer;
    border-radius:24px;
    z-index:4;
  }
  .hotspot:focus-visible{outline:5px solid rgba(255,255,255,.95);outline-offset:2px}
  .profiles{left:86.2%;top:3.3%;width:7.2%;height:7.4%}
  .settings{left:94.1%;top:2.9%;width:4.2%;height:7.3%;border-radius:50%}
  .gift{left:.6%;top:86%;width:6.4%;height:11.5%}
  .sky{left:8.1%;top:75.2%;width:15%;height:22%}
  .characters{left:24.4%;top:75.2%;width:15%;height:22%}
  .city{left:40.9%;top:75.2%;width:15%;height:22%}
  .music{left:57.3%;top:75.2%;width:15%;height:22%}
  .together{left:73.8%;top:75.2%;width:15%;height:22%}
  .map{left:91.7%;top:86%;width:6.5%;height:11.5%}

  .name-modal{
    position:fixed;
    inset:0;
    z-index:20;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(27,31,78,.58);
    backdrop-filter:blur(7px);
  }
  .name-modal.open{display:flex}
  .name-card{
    width:min(520px,92vw);
    border:3px solid rgba(255,255,255,.95);
    border-radius:32px;
    background:#fffaf3;
    box-shadow:0 24px 70px rgba(14,20,63,.4);
    padding:28px;
    text-align:center;
  }
  .name-card h1{margin:0;color:#6546ad;font-size:clamp(30px,6vw,48px)}
  .name-card p{color:#273769;font-size:18px;font-weight:700}
  .name-card input{
    width:100%;
    border:2px solid #d9caef;
    border-radius:17px;
    padding:14px 16px;
    color:#303762;
    background:#fff;
    font-size:20px;
    text-align:center;
  }
  .name-card button{
    width:100%;
    margin-top:14px;
    border:0;
    border-radius:17px;
    padding:14px 18px;
    background:#74bd32;
    color:#fff;
    font-size:20px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 6px 0 #4c8f1e;
  }
  .error{min-height:20px;margin-top:12px;color:#b13e55;font-weight:700}

  .toast{
    position:fixed;
    left:50%;
    top:20px;
    transform:translateX(-50%) translateY(-100px);
    background:rgba(255,255,255,.96);
    color:#5c3ca1;
    padding:12px 20px;
    border-radius:999px;
    font-weight:800;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    transition:.25s ease;
    z-index:30;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main class="screen">
  <div class="frame" aria-label="ELCraft Home World">
    <div class="profile-name-cover">
      <div><span id="profileName">Player</span><small>Level 1</small></div>
    </div>

    <div class="greeting-name-cover">Hi&nbsp;<span id="greetingName">Player</span>! ✨</div>
    <div class="owner-cover">🔒 This world belongs to&nbsp;<span id="ownerName">Player</span></div>

    <button class="hotspot profiles" data-label="Profiles" aria-label="Profiles"></button>
    <button class="hotspot settings" data-label="Settings" aria-label="Settings"></button>
    <button class="hotspot gift" data-label="Daily Gift" aria-label="Daily Gift"></button>
    <button class="hotspot sky" data-label="Sky World" aria-label="Sky World"></button>
    <button class="hotspot characters" data-label="My Characters" aria-label="My Characters"></button>
    <button class="hotspot city" data-label="My City" aria-label="My City"></button>
    <button class="hotspot music" data-label="Music" aria-label="Music"></button>
    <button class="hotspot together" data-label="Together" aria-label="Together"></button>
    <button class="hotspot map" data-label="Map" aria-label="Map"></button>
  </div>

  <div class="toast" id="toast" role="status"></div>
</main>

<div class="name-modal" id="nameModal" role="dialog" aria-modal="true" aria-labelledby="nameTitle">
  <section class="name-card">
    <h1 id="nameTitle">Welcome to ELCraft! ✨</h1>
    <p>What should we call you in your world?</p>
    <input id="nameInput" maxlength="20" autocomplete="given-name" placeholder="Type your first name">
    <button id="saveName" type="button">Enter My World</button>
    <div class="error" id="nameError" aria-live="polite"></div>
  </section>
</div>

<script>
(() => {
  const NAME_KEY = 'elcraft_child_name';
  const profileName = document.getElementById('profileName');
  const greetingName = document.getElementById('greetingName');
  const ownerName = document.getElementById('ownerName');
  const modal = document.getElementById('nameModal');
  const input = document.getElementById('nameInput');
  const error = document.getElementById('nameError');
  const toast = document.getElementById('toast');

  function cleanName(value) {
    return value.trim().replace(/\s+/g,' ').slice(0,20);
  }

  function applyName(name) {
    profileName.textContent = name;
    greetingName.textContent = name;
    ownerName.textContent = name;
  }

  function openNamePrompt() {
    modal.classList.add('open');
    setTimeout(() => input.focus(),100);
  }

  function saveName() {
    const name = cleanName(input.value);
    if (!name) {
      error.textContent = 'Please enter a name.';
      input.focus();
      return;
    }
    localStorage.setItem(NAME_KEY,name);
    applyName(name);
    modal.classList.remove('open');
  }

  const savedName = cleanName(localStorage.getItem(NAME_KEY) || '');
  if (savedName) {
    applyName(savedName);
  } else {
    openNamePrompt();
  }

  document.getElementById('saveName').addEventListener('click',saveName);
  input.addEventListener('keydown',e => {
    if (e.key === 'Enter') saveName();
  });

  document.querySelector('.profiles').addEventListener('click',() => {
    input.value = localStorage.getItem(NAME_KEY) || '';
    error.textContent = '';
    openNamePrompt();
  });

  document.querySelectorAll('.hotspot:not(.profiles)').forEach(btn => {
    btn.addEventListener('click',() => {
      const name = localStorage.getItem(NAME_KEY) || 'Player';
      toast.textContent = btn.dataset.label + ' is opening for ' + name + '…';
      toast.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => toast.classList.remove('show'),1400);
    });
  });
})();
</script>
</body>
</html>
