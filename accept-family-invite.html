<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#72b9ff">

  <title>Join an ELCraft Family</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --purple: #6559f4;
      --purple-dark: #4d47ba;
      --purple-light: #eeeaff;
      --ink: #353b68;
      --muted: #697198;
      --danger: #a52d40;
      --success: #27703f;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 20px;

      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at 12% 12%,
          rgba(255, 255, 255, 0.7),
          transparent 25%
        ),
        linear-gradient(
          145deg,
          #72d5ff,
          #72b9ff 46%,
          #a889ff
        );
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.64;
    }

    .card {
      width: min(610px, 100%);

      border: 4px solid rgba(255, 255, 255, 0.9);
      border-radius: 30px;
      padding: clamp(24px, 6vw, 40px);

      background: white;

      text-align: center;

      box-shadow:
        0 24px 65px rgba(42, 48, 120, 0.3);
    }

    .icon {
      font-size: 78px;
    }

    h1 {
      margin: 12px 0 0;
      color: #554ecb;
    }

    .status {
      margin: 10px 0 0;

      color: var(--muted);
      font-weight: 700;
      line-height: 1.5;
    }

    .invite-details {
      margin-top: 20px;
      border: 2px solid #e4e0f8;
      border-radius: 18px;
      padding: 15px;

      background: #faf9ff;
    }

    .invite-details strong {
      display: block;

      color: var(--purple-dark);
      font-size: 18px;
    }

    .invite-details span {
      display: block;

      margin-top: 5px;

      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .message {
      display: none;

      margin-top: 18px;
      border-radius: 13px;
      padding: 13px;

      font-weight: 800;
      line-height: 1.45;
    }

    .message.visible {
      display: block;
    }

    .message.success {
      color: var(--success);
      background: #e8f8ec;
    }

    .message.error {
      color: var(--danger);
      background: #ffe8ec;
    }

    .message.info {
      color: var(--purple-dark);
      background: var(--purple-light);
    }

    .auth-panel {
      display: none;

      margin-top: 20px;
      border-top: 2px solid #ece9f8;
      padding-top: 20px;

      text-align: left;
    }

    .auth-panel.visible {
      display: block;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;

      margin-bottom: 15px;
      border-radius: 14px;
      padding: 5px;

      background: #f0eef9;
    }

    .tab {
      border: 0;
      border-radius: 10px;
      padding: 10px;

      color: #777c98;
      background: transparent;

      font-size: 11px;
      font-weight: 900;
    }

    .tab.active {
      color: white;
      background: var(--purple);
    }

    .form {
      display: grid;
      gap: 11px;
    }

    .form.hidden {
      display: none;
    }

    label {
      display: block;

      margin-bottom: 5px;

      color: #535978;
      font-size: 11px;
      font-weight: 900;
    }

    input {
      width: 100%;

      border: 2px solid #dddbea;
      border-radius: 13px;
      padding: 12px 13px;

      outline: none;

      color: var(--ink);
      background: #f8faff;
    }

    input:focus {
      border-color: #8f80ec;

      box-shadow:
        0 0 0 4px rgba(101, 89, 244, 0.1);
    }

    .button {
      display: inline-block;

      margin-top: 16px;
      border: 0;
      border-radius: 15px;
      padding: 14px 20px;

      color: white;
      background:
        linear-gradient(
          135deg,
          #6559f4,
          #9168ff
        );

      font-weight: 900;
      text-decoration: none;
    }

    .button.full {
      width: 100%;
    }

    .secondary {
      width: 100%;

      margin-top: 9px;
      border: 0;
      border-radius: 13px;
      padding: 11px;

      color: var(--purple-dark);
      background: var(--purple-light);

      font-size: 11px;
      font-weight: 900;
    }

    .loading {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-top: 18px;

      color: var(--purple-dark);
      font-weight: 900;
    }

    .loading[hidden] {
      display: none;
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="icon">
      💌
    </div>

    <h1>
      Join an ELCraft Family
    </h1>

    <p
      id="statusText"
      class="status">
      Checking your family invitation...
    </p>

    <section
      id="inviteDetails"
      class="invite-details"
      hidden>

      <strong id="inviteName">
        Family invitation
      </strong>

      <span id="inviteDescription"></span>
    </section>

    <div
      id="loading"
      class="loading">
      ✨ Opening your invitation...
    </div>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite">
    </div>

    <section
      id="authPanel"
      class="auth-panel">

      <div class="tabs">

        <button
          id="signInTab"
          class="tab active"
          type="button">
          I Have an Account
        </button>

        <button
          id="createTab"
          class="tab"
          type="button">
          Create My Account
        </button>

      </div>

      <form
        id="signInForm"
        class="form">

        <div>
          <label for="signInEmail">
            Invited email
          </label>

          <input
            id="signInEmail"
            type="email"
            autocomplete="email"
            readonly>
        </div>

        <div>
          <label for="signInPassword">
            Password
          </label>

          <input
            id="signInPassword"
            type="password"
            autocomplete="current-password"
            minlength="6"
            required>
        </div>

        <button
          id="signInButton"
          class="button full"
          type="submit">
          Sign In and Join
        </button>
      </form>

      <form
        id="createForm"
        class="form hidden">

        <div>
          <label for="createName">
            Your name
          </label>

          <input
            id="createName"
            type="text"
            maxlength="60"
            autocomplete="name"
            required>
        </div>

        <div>
          <label for="createEmail">
            Invited email
          </label>

          <input
            id="createEmail"
            type="email"
            autocomplete="email"
            readonly>
        </div>

        <div>
          <label for="createPassword">
            Create a password
          </label>

          <input
            id="createPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required>
        </div>

        <div>
          <label for="confirmPassword">
            Confirm password
          </label>

          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required>
        </div>

        <button
          id="createButton"
          class="button full"
          type="submit">
          Create Account and Join
        </button>
      </form>

      <button
        id="emailLinkButton"
        class="secondary"
        type="button">
        Email Me a Fresh Sign-In Link
      </button>

    </section>

    <a
      id="continueButton"
      class="button"
      href="family-castle.html"
      hidden>
      Enter the Family Castle
    </a>

  </main>

  <script type="module">
    import { supabase } from "./supabase-client.js";

    const TOKEN_STORAGE_KEY =
      "elcraft_pending_family_invite";

    const statusText =
      document.getElementById("statusText");

    const inviteDetails =
      document.getElementById("inviteDetails");

    const inviteName =
      document.getElementById("inviteName");

    const inviteDescription =
      document.getElementById("inviteDescription");

    const loading =
      document.getElementById("loading");

    const message =
      document.getElementById("message");

    const authPanel =
      document.getElementById("authPanel");

    const signInTab =
      document.getElementById("signInTab");

    const createTab =
      document.getElementById("createTab");

    const signInForm =
      document.getElementById("signInForm");

    const createForm =
      document.getElementById("createForm");

    const signInEmail =
      document.getElementById("signInEmail");

    const signInPassword =
      document.getElementById("signInPassword");

    const createName =
      document.getElementById("createName");

    const createEmail =
      document.getElementById("createEmail");

    const createPassword =
      document.getElementById("createPassword");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const signInButton =
      document.getElementById("signInButton");

    const createButton =
      document.getElementById("createButton");

    const emailLinkButton =
      document.getElementById("emailLinkButton");

    const continueButton =
      document.getElementById("continueButton");

    let token = null;
    let invitation = null;

    function show(
      text,
      type = "info"
    ) {
      message.textContent =
        text;

      message.className =
        `message visible ${type}`;
    }

    function clearMessage() {
      message.textContent =
        "";

      message.className =
        "message";
    }

    function relationshipLabel(value) {
      return ({
        parent: "parent or stepparent",
        grandparent: "grandparent",
        older_sibling: "older sibling",
        aunt_uncle: "aunt or uncle",
        guardian: "guardian",
        family_member: "family member"
      })[value] || "family member";
    }

    function readToken() {
      const params =
        new URLSearchParams(
          window.location.search
        );

      const urlToken =
        params.get("token");

      if (urlToken) {
        localStorage.setItem(
          TOKEN_STORAGE_KEY,
          urlToken
        );

        return urlToken;
      }

      return localStorage.getItem(
        TOKEN_STORAGE_KEY
      );
    }

    function currentInviteUrl() {
      const url =
        new URL(
          "accept-family-invite.html",
          window.location.href
        );

      url.searchParams.set(
        "token",
        token
      );

      return url;
    }

    function showSignIn() {
      clearMessage();

      signInTab.classList.add(
        "active"
      );

      createTab.classList.remove(
        "active"
      );

      signInForm.classList.remove(
        "hidden"
      );

      createForm.classList.add(
        "hidden"
      );

      signInPassword.focus();
    }

    function showCreate() {
      clearMessage();

      createTab.classList.add(
        "active"
      );

      signInTab.classList.remove(
        "active"
      );

      createForm.classList.remove(
        "hidden"
      );

      signInForm.classList.add(
        "hidden"
      );

      createName.focus();
    }

    async function acceptInvitation() {
      const {
        data: member,
        error
      } = await supabase.rpc(
        "accept_family_invitation",
        {
          supplied_token:
            token
        }
      );

      if (error) {
        throw error;
      }

      localStorage.removeItem(
        TOKEN_STORAGE_KEY
      );

      statusText.textContent =
        `You're connected as ${
          member.display_name ||
          invitation?.invited_name ||
          "a family member"
        }.`;

      show(
        "Your family profile is ready. You can now enter the Family Castle and access the child profiles shared with you.",
        "success"
      );

      authPanel.classList.remove(
        "visible"
      );

      continueButton.hidden =
        false;

      loading.hidden =
        true;

      window.history.replaceState(
        {},
        document.title,
        "accept-family-invite.html"
      );
    }

    async function loadInvitation() {
      token =
        readToken();

      if (!token) {
        loading.hidden =
          true;

        statusText.textContent =
          "This invitation link is incomplete.";

        show(
          "Ask the parent to resend your ELCraft invitation.",
          "error"
        );

        return;
      }

      const {
        data,
        error
      } = await supabase.rpc(
        "get_family_invitation",
        {
          supplied_token:
            token
        }
      );

      if (error) {
        throw error;
      }

      invitation =
        Array.isArray(data)
          ? data[0]
          : data;

      if (!invitation) {
        loading.hidden =
          true;

        statusText.textContent =
          "This invitation cannot be found.";

        show(
          "The invitation may have been cancelled. Ask the parent to send a new one.",
          "error"
        );

        return;
      }

      inviteDetails.hidden =
        false;

      inviteName.textContent =
        `${
          invitation.invited_name ||
          "You"
        }, you're invited!`;

      inviteDescription.textContent =
        `${
          invitation.family_name ||
          "An ELCraft family"
        } invited you as a ${
          relationshipLabel(
            invitation.invited_relationship
          )
        }.`;

      signInEmail.value =
        invitation.invited_email ||
        "";

      createEmail.value =
        invitation.invited_email ||
        "";

      createName.value =
        invitation.invited_name ||
        "";

      if (
        invitation.invitation_status ===
        "accepted"
      ) {
        loading.hidden =
          true;

        statusText.textContent =
          "This invitation has already been accepted.";

        show(
          "Sign in with the invited email to enter the Family Castle.",
          "info"
        );

        authPanel.classList.add(
          "visible"
        );

        return;
      }

      if (
        invitation.invitation_status !==
        "pending"
      ) {
        loading.hidden =
          true;

        statusText.textContent =
          "This invitation is no longer active.";

        show(
          "Ask the parent to send a new invitation.",
          "error"
        );

        return;
      }

      if (
        invitation.expires_at &&
        new Date(
          invitation.expires_at
        ).getTime() <=
          Date.now()
      ) {
        loading.hidden =
          true;

        statusText.textContent =
          "This invitation has expired.";

        show(
          "Ask the parent to press Resend in the Family Portal.",
          "error"
        );

        return;
      }

      const {
        data: {
          session
        }
      } = await supabase.auth
        .getSession();

      if (session?.user) {
        const signedInEmail =
          String(
            session.user.email || ""
          ).toLowerCase();

        const invitedEmail =
          String(
            invitation.invited_email || ""
          ).toLowerCase();

        if (
          signedInEmail !==
          invitedEmail
        ) {
          await supabase.auth.signOut();

          loading.hidden =
            true;

          statusText.textContent =
            "Use the invited email address.";

          show(
            `Please sign in with ${invitation.invited_email}.`,
            "error"
          );

          authPanel.classList.add(
            "visible"
          );

          return;
        }

        statusText.textContent =
          "Connecting you to the family...";

        await acceptInvitation();

        return;
      }

      loading.hidden =
        true;

      statusText.textContent =
        "Sign in or create your family account to continue.";

      authPanel.classList.add(
        "visible"
      );
    }

    signInTab.addEventListener(
      "click",
      showSignIn
    );

    createTab.addEventListener(
      "click",
      showCreate
    );

    signInForm.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        clearMessage();

        signInButton.disabled =
          true;

        signInButton.textContent =
          "Signing In...";

        try {
          const {
            data,
            error
          } = await supabase.auth
            .signInWithPassword({
              email:
                signInEmail.value
                  .trim()
                  .toLowerCase(),
              password:
                signInPassword.value
            });

          if (error) {
            throw error;
          }

          if (!data.user) {
            throw new Error(
              "The account could not be opened."
            );
          }

          const invitedEmail =
            String(
              invitation.invited_email || ""
            ).toLowerCase();

          if (
            String(
              data.user.email || ""
            ).toLowerCase() !==
            invitedEmail
          ) {
            await supabase.auth
              .signOut();

            throw new Error(
              `Please use ${invitation.invited_email}.`
            );
          }

          statusText.textContent =
            "Connecting you to the family...";

          loading.hidden =
            false;

          await acceptInvitation();

        } catch (error) {
          console.error(
            "Invitation sign-in error:",
            error
          );

          show(
            error?.message ||
            "Unable to sign in.",
            "error"
          );

          signInButton.disabled =
            false;

          signInButton.textContent =
            "Sign In and Join";
        }
      }
    );

    createForm.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        clearMessage();

        const password =
          createPassword.value;

        if (
          password !==
          confirmPassword.value
        ) {
          show(
            "The passwords do not match.",
            "error"
          );

          return;
        }

        createButton.disabled =
          true;

        createButton.textContent =
          "Creating Account...";

        try {
          const {
            data,
            error
          } = await supabase.auth
            .signUp({
              email:
                createEmail.value
                  .trim()
                  .toLowerCase(),
              password,
              options: {
                data: {
                  display_name:
                    createName.value
                      .trim(),
                  full_name:
                    createName.value
                      .trim(),
                  account_type:
                    "family_member",
                  elcraft_family_invite:
                    true
                },
                emailRedirectTo:
                  currentInviteUrl().href
              }
            });

          if (error) {
            throw error;
          }

          if (data.session?.user) {
            statusText.textContent =
              "Connecting you to the family...";

            loading.hidden =
              false;

            await acceptInvitation();

            return;
          }

          show(
            "Account created. Check your email to confirm it, then this invitation page will finish connecting you.",
            "success"
          );

          createButton.disabled =
            false;

          createButton.textContent =
            "Create Account and Join";

        } catch (error) {
          console.error(
            "Invitation signup error:",
            error
          );

          show(
            error?.message ||
            "Unable to create the account.",
            "error"
          );

          createButton.disabled =
            false;

          createButton.textContent =
            "Create Account and Join";
        }
      }
    );

    emailLinkButton.addEventListener(
      "click",
      async () => {
        clearMessage();

        emailLinkButton.disabled =
          true;

        emailLinkButton.textContent =
          "Sending...";

        try {
          const {
            error
          } = await supabase.auth
            .signInWithOtp({
              email:
                invitation.invited_email,
              options: {
                shouldCreateUser:
                  true,
                emailRedirectTo:
                  currentInviteUrl().href,
                data: {
                  display_name:
                    invitation.invited_name,
                  elcraft_family_invite:
                    true
                }
              }
            });

          if (error) {
            throw error;
          }

          show(
            `A fresh ELCraft sign-in link was sent to ${invitation.invited_email}.`,
            "success"
          );

        } catch (error) {
          show(
            error?.message ||
            "Unable to send the sign-in email.",
            "error"
          );

        } finally {
          emailLinkButton.disabled =
            false;

          emailLinkButton.textContent =
            "Email Me a Fresh Sign-In Link";
        }
      }
    );

    loadInvitation().catch(
      error => {
        console.error(
          "Invitation loading error:",
          error
        );

        loading.hidden =
          true;

        statusText.textContent =
          "We could not open this invitation.";

        show(
          error?.message ||
          "Ask the parent to resend the invitation.",
          "error"
        );
      }
    );
  </script>
</body>
</html>
