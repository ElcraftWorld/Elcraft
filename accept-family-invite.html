<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join an ELCraft Family</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,Helvetica,sans-serif;color:#353b68;background:linear-gradient(145deg,#72d5ff,#72b9ff 46%,#a889ff)}
    .card{width:min(560px,100%);border:4px solid rgba(255,255,255,.9);border-radius:30px;padding:34px;background:white;text-align:center;box-shadow:0 24px 65px rgba(42,48,120,.3)}
    .icon{font-size:72px}.card h1{margin:12px 0;color:#554ecb}.card p{color:#697198;font-weight:700;line-height:1.5}
    .button{display:inline-block;margin-top:16px;border:0;border-radius:15px;padding:14px 20px;color:white;background:linear-gradient(135deg,#6559f4,#9168ff);font-weight:900;text-decoration:none;cursor:pointer}
    .message{margin-top:18px;padding:13px;border-radius:13px;font-weight:800}.success{color:#27703f;background:#e8f8ec}.error{color:#a52d40;background:#ffe8ec}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">💌</div>
    <h1>Welcome to ELCraft Family</h1>
    <p id="statusText">Checking your family invitation...</p>
    <div id="message"></div>
    <a id="continueButton" class="button" href="profiles.html" hidden>Enter ELCraft</a>
  </main>

<script type="module">
  import { supabase } from "./supabase-client.js";

  const statusText = document.getElementById("statusText");
  const message = document.getElementById("message");
  const continueButton = document.getElementById("continueButton");

  function show(text, type) {
    message.textContent = text;
    message.className = `message ${type}`;
  }

  async function acceptInvite() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
      statusText.textContent = "This invitation link is incomplete.";
      show("Ask the parent to send a new invitation.", "error");
      return;
    }

    const { data: { session }, error: sessionError } = await supabase.auth.getSession();

    if (sessionError || !session) {
      statusText.textContent = "Finish signing in from the email link.";
      show("Open the newest ELCraft invitation email and use that link.", "error");
      return;
    }

    const { data: member, error } = await supabase.rpc("accept_family_invitation", {
      supplied_token: token
    });

    if (error) {
      statusText.textContent = "We could not accept this invitation.";
      show(error.message, "error");
      return;
    }

    statusText.textContent = `You're connected as ${member.display_name}.`;
    show("Your family profile is ready. You can now choose the child profile shared with you.", "success");
    continueButton.hidden = false;
    window.history.replaceState({}, document.title, "accept-family-invite.html");
  }

  acceptInvite();
</script>
</body>
</html>
