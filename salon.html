<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#f7efff">

  <title>ELCraft — Avatar Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --purple: #6f55d9;
      --purple-dark: #4e3aa9;
      --purple-light: #eee9ff;
      --pink: #ff83b8;
      --blue: #65c9ef;
      --green: #75c95c;
      --gold: #ffd45e;
      --ink: #35405f;
      --muted: #747c98;
      --panel: rgba(255, 255, 255, 0.96);
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at 12% 12%,
          rgba(255,255,255,.9),
          transparent 25%
        ),
        linear-gradient(
          145deg,
          #ffe2f1,
          #e7ddff 48%,
          #dff5ff
        );
    }

    button {
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      cursor: wait;
      opacity: .65;
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      min-height: 86px;
      padding: 12px 18px;

      border-bottom: 4px solid rgba(111,85,217,.12);

      background: rgba(255,255,255,.95);
      backdrop-filter: blur(14px);

      box-shadow:
        0 7px 22px rgba(63,52,115,.12);
    }

    .header-left {
      min-width: 0;

      display: flex;
      align-items: center;
      gap: 13px;
    }

    .back-button {
      flex: 0 0 auto;

      border: 0;
      border-radius: 999px;
      padding: 11px 17px;

      color: var(--purple-dark);
      background: var(--purple-light);

      font-weight: 900;

      box-shadow:
        0 5px 0 rgba(79,58,169,.13);
    }

    .header-icon {
      font-size: 42px;
    }

    .title-group {
      min-width: 0;
    }

    .title-group h1 {
      margin: 0;

      color: var(--purple-dark);
      font-size: clamp(27px,3vw,43px);
      line-height: 1;
    }

    .title-group p {
      margin: 5px 0 0;

      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .player-pill {
      flex: 0 0 auto;

      max-width: 250px;

      overflow: hidden;

      border-radius: 999px;
      padding: 11px 16px;

      color: var(--purple-dark);
      background: #f6ecff;

      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workspace {
      flex: 1 1 auto;

      display: grid;
      grid-template-columns:
        minmax(250px,.85fr)
        minmax(420px,1.25fr)
        minmax(250px,.85fr);
      gap: 16px;

      padding: 16px;
    }

    .panel {
      min-width: 0;

      border: 4px solid rgba(255,255,255,.9);
      border-radius: 28px;

      background: var(--panel);

      box-shadow:
        0 12px 0 rgba(97,70,144,.08),
        0 22px 42px rgba(75,61,120,.15);
    }

    .tools-panel,
    .colors-panel {
      display: flex;
      flex-direction: column;

      padding: 16px;
    }

    .panel-title {
      margin: 0 0 11px;

      color: var(--purple-dark);
      font-size: 24px;
      text-align: center;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;

      margin-bottom: 12px;
    }

    .tab-button {
      min-height: 44px;

      border: 0;
      border-radius: 14px;
      padding: 9px;

      color: #685a8b;
      background: #f0ecf8;

      font-size: 12px;
      font-weight: 900;
    }

    .tab-button.active {
      color: white;
      background:
        linear-gradient(
          135deg,
          var(--purple),
          #9579f7
        );
    }

    .options {
      display: grid;
      grid-template-columns:
        repeat(2,minmax(0,1fr));
      align-content: start;
      gap: 9px;

      min-height: 0;
      overflow-y: auto;
    }

    .option-button {
      min-height: 78px;

      border: 3px solid #eeeaf7;
      border-radius: 18px;
      padding: 9px 6px;

      color: #4e4b70;
      background: white;

      font-size: 11px;
      font-weight: 900;

      box-shadow:
        0 4px 0 rgba(80,65,120,.09);
    }

    .option-button.active {
      border-color: var(--pink);
      background: #fff2f8;
    }

    .option-icon {
      display: block;

      margin-bottom: 5px;

      font-size: 30px;
      line-height: 1;
    }

    .preview-panel {
      position: relative;
      overflow: hidden;

      display: grid;
      place-items: center;

      min-height: 650px;

      padding: 20px;

      background:
        radial-gradient(
          circle at 50% 18%,
          rgba(255,255,255,.94),
          transparent 28%
        ),
        repeating-linear-gradient(
          135deg,
          #fff7fb 0 28px,
          #eef8ff 28px 56px
        );
    }

    .preview-panel::before {
      content: "";

      position: absolute;
      inset: 28px;

      border: 8px solid #f2b7d5;
      border-radius: 48% 48% 28% 28% / 30% 30% 20% 20%;

      box-shadow:
        inset 0 0 0 7px white,
        0 14px 0 #d98fb5,
        0 26px 35px rgba(83,55,104,.17);

      background:
        radial-gradient(
          circle at 50% 22%,
          rgba(255,255,255,.95),
          rgba(221,243,252,.9) 58%,
          #d7eaf4
        );
    }

    .avatar-stage {
      position: relative;
      z-index: 2;

      width: min(100%,520px);
      height: 580px;

      display: grid;
      place-items: center;
    }

    #avatarSvg {
      width: 100%;
      height: 100%;

      overflow: visible;

      filter:
        drop-shadow(
          0 18px 12px
          rgba(58,62,104,.18)
        );
    }

    .avatar-name {
      position: absolute;
      left: 50%;
      bottom: 20px;

      transform: translateX(-50%);

      max-width: 240px;

      overflow: hidden;

      border: 4px solid white;
      border-radius: 999px;
      padding: 8px 18px;

      color: var(--purple-dark);
      background: rgba(255,255,255,.96);

      font-size: 18px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;

      box-shadow:
        0 7px 18px rgba(73,58,115,.16);
    }

    .color-section {
      margin-bottom: 14px;
    }

    .color-label {
      margin: 0 0 8px;

      color: var(--purple-dark);
      font-size: 13px;
      font-weight: 900;
      text-align: center;
    }

    .swatches {
      display: grid;
      grid-template-columns:
        repeat(4,minmax(0,1fr));
      gap: 8px;
    }

    .swatch {
      min-height: 48px;

      border: 4px solid white;
      border-radius: 15px;

      box-shadow:
        0 0 0 2px #dad2eb;
    }

    .swatch.active {
      box-shadow:
        0 0 0 5px var(--purple);
    }

    .actions {
      display: grid;
      gap: 9px;

      margin-top: auto;
    }

    .action-button {
      min-height: 49px;

      border: 0;
      border-radius: 16px;
      padding: 11px;

      color: white;

      font-weight: 900;
    }

    .random-button {
      background: var(--blue);
      box-shadow: 0 5px 0 #3499bd;
    }

    .save-button {
      background: var(--green);
      box-shadow: 0 5px 0 #4d9636;
    }

    .reset-button {
      background: var(--pink);
      box-shadow: 0 5px 0 #d6578f;
    }

    .save-note {
      margin-top: 9px;

      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      line-height: 1.4;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 100px;
      z-index: 1000;

      max-width: min(90vw,520px);

      transform:
        translateX(-50%)
        translateY(-150px);

      border: 4px solid white;
      border-radius: 999px;
      padding: 13px 20px;

      color: var(--purple-dark);
      background: white;

      font-weight: 900;
      text-align: center;

      box-shadow:
        0 13px 30px rgba(48,39,90,.25);

      transition:
        transform .25s ease;
    }

    .toast.show {
      transform:
        translateX(-50%)
        translateY(0);
    }

    @media (max-width: 1000px) {
      .workspace {
        grid-template-columns:
          minmax(200px,.75fr)
          minmax(350px,1.3fr)
          minmax(200px,.75fr);
        gap: 10px;
        padding: 10px;
      }

      .preview-panel {
        min-height: 560px;
      }

      .avatar-stage {
        height: 500px;
      }
    }

    @media (max-width: 800px) {
      .header-icon,
      .title-group p,
      .player-pill {
        display: none;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .preview-panel {
        min-height: 560px;
        order: -1;
      }

      .options {
        grid-template-columns:
          repeat(3,minmax(0,1fr));
      }

      .swatches {
        grid-template-columns:
          repeat(6,minmax(0,1fr));
      }
    }

    @media (max-width: 520px) {
      .header {
        min-height: 72px;
        padding: 9px 10px;
      }

      .back-button {
        padding: 10px 13px;
      }

      .title-group h1 {
        font-size: 24px;
      }

      .preview-panel {
        min-height: 480px;
      }

      .avatar-stage {
        height: 430px;
      }

      .options {
        grid-template-columns:
          repeat(2,minmax(0,1fr));
      }

      .swatches {
        grid-template-columns:
          repeat(4,minmax(0,1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .toast {
        transition: none;
      }
    }
  </style>
</head>

      let toastTimer =

      function possessive(name) {
        return name.endsWith("s")
          ? `${name}' Avatar`
          : `${name}'s Avatar`;
      }

      function showToast(message) {
        toast.textContent =
          message;

        toast.classList.add(
          "show"
        );

        window.clearTimeout(
          toastTimer
        );

        toastTimer =
          window.setTimeout(
            () => {
              toast.classList.remove(
                "show"
              );
            },
            2200
          );
      }

      function restoreStyle() {
        try {
          const saved =
            JSON.parse(
              localStorage.getItem(
                STYLE_KEY
              ) || "null"
            );

          if (saved) {
            Object.assign(
              state,
              saved
            );
          }
        } catch {
          localStorage.removeItem(
            STYLE_KEY
          );
        }
      }

      function renderOptions() {
        options.replaceChildren();

        const current =
          state[state.tab];

        OPTIONS[state.tab]
          .forEach(item => {
            const button =
              document.createElement(
                "button"
              );

            button.type =
              "button";

            button.className =
              `option-button${
                current === item.id
                  ? " active"
                  : ""
              }`;

            button.innerHTML =
              `<span class="option-icon">${item.icon}</span>${item.label}`;

            button.addEventListener(
              "click",
              () => {
                state[state.tab] =
                  item.id;

                renderOptions();
                renderAvatar();
              }
            );

            options.appendChild(
              button
            );
          });
      }

      function renderSwatches(
        container,
        colors,
        selected,
        key
      ) {
        container.replaceChildren();

        colors.forEach(color => {
          const button =
            document.createElement(
              "button"
            );

          button.type =
            "button";

          button.className =
            `swatch${
              color === selected
                ? " active"
                : ""
            }`;

          button.style.background =
            color;

          button.setAttribute(
            "aria-label",
            `Choose ${key} color`
          );

          button.addEventListener(
            "click",
            () => {
              state[key] =
                color;

              renderAllSwatches();
              renderAvatar();
            }
          );

          container.appendChild(
            button
          );
        });
      }

      function renderAllSwatches() {
        renderSwatches(
          skinSwatches,
          SKIN_COLORS,
          state.skin,
          "skin"
        );

        renderSwatches(
          hairSwatches,
          HAIR_COLORS,
          state.hairColor,
          "hairColor"
        );

        renderSwatches(
          outfitSwatches,
          OUTFIT_COLORS,
          state.outfitColor,
          "outfitColor"
        );
      }

      function setSkinColor() {
        [
          "head",
          "leftEar",
          "rightEar",
          "leftArm",
          "rightArm",
          "leftHand",
          "rightHand",
          "leftLeg",
          "rightLeg"
        ].forEach(id => {
          const element =
            document.getElementById(id);

          if (element) {
            element.setAttribute(
              "fill",
              state.skin
            );
          }
        });
      }

      function renderFace() {
        const head =
          document.getElementById(
            "head"
          );

        const mouth =
          document.getElementById(
            "mouth"
          );

        const leftBlush =
          document.getElementById(
            "leftBlush"
          );

        const rightBlush =
          document.getElementById(
            "rightBlush"
          );

        const leftEye =
          document.getElementById(
            "leftEyeWhite"
          );

        const rightEye =
          document.getElementById(
            "rightEyeWhite"
          );

        head.setAttribute(
          "rx",
          state.face === "oval"
            ? "90"
            : state.face === "wide"
              ? "107"
              : "100"
        );

        mouth.setAttribute(
          "d",
          state.face === "wide"
            ? "M167 232 Q210 274 253 232 Q210 289 167 232"
            : "M176 236 Q210 266 244 236 Q210 279 176 236"
        );

        const rosy =
          state.face === "rosy";

        leftBlush.setAttribute(
          "fill",
          rosy
            ? "rgba(255,102,137,.42)"
            : "rgba(255,120,145,.20)"
        );

        rightBlush.setAttribute(
          "fill",
          rosy
            ? "rgba(255,102,137,.42)"
            : "rgba(255,120,145,.20)"
        );

        const bright =
          state.face === "bright";

        leftEye.setAttribute(
          "rx",
          bright
            ? "23"
            : "20"
        );

        rightEye.setAttribute(
          "rx",
          bright
            ? "23"
            : "20"
        );

        let freckles =
          document.getElementById(
            "freckles"
          );

        if (!freckles) {
          freckles =
            document.createElementNS(
              "http://www.w3.org/2000/svg",
              "g"
            );

          freckles.id =
            "freckles";

          freckles.innerHTML = `
            <circle cx="174" cy="217" r="3" fill="rgba(105,65,44,.45)"></circle>

          document
            .getElementById(
              "faceFeatures"
            )
            .appendChild(
              freckles
            );
        }

        freckles.style.display =
          state.face === "freckles"
            ? ""
            : "none";
      }

      function renderOutfit() {

          state.outfitColor
        );

          state.outfit === "tee"
        ) {

            "d",

          );

          );

            "M124 291 Q145 255 177 249 L243 249 Q275 255 296 291 L278 407 Q210 429 142 407 Z"

          shirtAccent.setAttribute(

      function renderAvatar() {
        setSkinColor();
        renderHair();
        renderFace();
        renderOutfit();
        renderExtra();
      }

      function renderEverything() {
        renderOptions();
        renderAllSwatches();
        renderAvatar();
      }

      function randomItem(list) {
        return list[
          Math.floor(
            Math.random() *
            list.length
          )
        ];
      }

      function randomize() {
        state.hair =
          randomItem(
            OPTIONS.hair
          ).id;

        state.face =
          randomItem(
            OPTIONS.face
          ).id;

        state.outfit =
          randomItem(
            OPTIONS.outfit
          ).id;

        state.extra =
          randomItem(
            OPTIONS.extra
          ).id;

        state.skin =
          randomItem(
            SKIN_COLORS
          );

        state.hairColor =
          randomItem(
            HAIR_COLORS
          );

        state.outfitColor =
          randomItem(
            OUTFIT_COLORS
          );

        renderEverything();

        showToast(
          "Surprise avatar created! 🎉"
        );
      }

      function resetAvatar() {
        Object.assign(
          state,
          DEFAULT_STYLE
        );

        document
          .querySelectorAll(
            ".tab-button"
          )
          .forEach(button => {
            button.classList.toggle(
              "active",
              button.dataset.tab ===
                state.tab
            );
          });

        renderEverything();

        showToast(
          "Ready for a new look!"
        );
      }

      function svgToDataUrl() {
        const clone =
          avatarSvg.cloneNode(
            true
          );

        clone.setAttribute(
          "xmlns",
          "http://www.w3.org/2000/svg"
        );

        const serialized =
          new XMLSerializer()
            .serializeToString(
              clone
            );

        return (
          "data:image/svg+xml;charset=utf-8," +
          encodeURIComponent(
            serialized
          )
        );
      }

      function saveAvatar() {
        const dataUrl =
          svgToDataUrl();

        localStorage.setItem(
          STYLE_KEY,
          JSON.stringify(
            state
          )
        );

        localStorage.setItem(
          AVATAR_KEY,
          dataUrl
        );

        window.dispatchEvent(
          new StorageEvent(
            "storage",
            {
              key:
                AVATAR_KEY,

              newValue:
                dataUrl
            }
          )
        );

        showToast(
          "Your avatar was saved to My World! ✨"
        );
      }

      document
        .querySelectorAll(
          ".tab-button"
        )
        .forEach(button => {
          button.addEventListener(
            "click",
            () => {
              state.tab =
                button.dataset.tab;

              document
                .querySelectorAll(
                  ".tab-button"
                )
                .forEach(item => {
                  item.classList.toggle(
                    "active",
                    item === button
                  );
                });

              renderOptions();
            }
          );
        });

      document
        .getElementById(
          "backButton"
        )
        .addEventListener(
          "click",
          () => {
            window.location.href =
              "my-city.html";
          }
        );

      document
        .getElementById(
          "randomButton"
        )
        .addEventListener(
          "click",
          randomize
        );

      document
        .getElementById(
          "resetButton"
        )
        .addEventListener(
          "click",
          resetAvatar
        );

      document
        .getElementById(
          "saveButton"
        )
        .addEventListener(
          "click",
          saveAvatar
        );

      restoreStyle();

      avatarName.textContent =
        childName;

      playerPill.textContent =
        `✨ ${possessive(childName)}`;

      renderEverything();
    })();
  </script>
