<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6f4bb3">
<title>ELCraft Royal Salon</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Arial,Helvetica,sans-serif;color:#3d3866;background:radial-gradient(circle at 50% 5%,#fff6bc,transparent 20%),linear-gradient(145deg,#bba0ed,#f6d5eb 58%,#fff3d1);padding:16px}.top{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:4px solid #fff;border-radius:22px;background:#ffffffed;box-shadow:0 14px 38px #4b33742b}.top h1{margin:0;color:#6746aa;font-size:clamp(25px,4vw,38px)}button{font:inherit;cursor:pointer}.nav{border:0;border-radius:14px;padding:11px 15px;font-weight:1000;color:#fff;background:#7758df}.layout{width:min(1180px,100%);margin:16px auto 0;display:grid;grid-template-columns:minmax(320px,.85fr) minmax(420px,1.15fr);gap:16px}.panel{border:5px solid #fff;border-radius:28px;padding:18px;background:#ffffffef;box-shadow:0 20px 48px #4933702d}.mirror{min-height:640px;display:grid;place-items:center;background:linear-gradient(145deg,#fef6ff,#fff8db);position:relative;overflow:hidden}.mirror:before{content:"";position:absolute;inset:20px;border:13px solid #deb75a;border-radius:46% 46% 35% 35%;box-shadow:inset 0 0 0 7px #fff0a3}.avatar{position:relative;z-index:2;text-align:center;filter:drop-shadow(0 15px 12px #60478935)}.head{position:relative;width:220px;height:245px;margin:auto;border-radius:48% 48% 44% 44%;background:#a66f4c;border:8px solid #593c35}.hair{position:absolute;left:-16px;right:-16px;top:-29px;height:112px;border-radius:55% 55% 40% 40%;background:#36221f;z-index:2}.eyes{position:absolute;left:42px;right:42px;top:100px;display:flex;justify-content:space-between;font-size:29px}.facepaint{position:absolute;inset:0;display:grid;place-items:center;font-size:53px;padding-top:53px}.crown{position:absolute;left:50%;top:-72px;transform:translateX(-50%);font-size:76px;z-index:4}.neck{width:70px;height:45px;margin:-8px auto 0;background:#a66f4c}.outfit{width:260px;height:230px;margin:auto;border-radius:90px 90px 25px 25px;background:#7555d5;border:8px solid #503a96;display:grid;place-items:center;font-size:65px}.jewelry{position:absolute;left:50%;top:230px;transform:translateX(-50%);font-size:48px;z-index:5}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{border:3px solid #e5dbf4;border-radius:13px;padding:9px 11px;background:#fff;color:#594585;font-weight:1000}.tab.active{border-color:#ff76ad;background:#fff0f7;color:#9d3467}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.choice{min-height:78px;border:3px solid #e6ddf4;border-radius:16px;background:#fff;font-size:31px;font-weight:1000;color:#5e4a8d}.choice.active{border-color:#ff76ad;background:#fff0f7;box-shadow:0 0 0 3px #ffd0e4}.save{width:100%;margin-top:15px;border:0;border-radius:16px;padding:14px;color:#fff;background:linear-gradient(#76ce58,#4cae35);box-shadow:0 6px 0 #378c28;font-weight:1000}.status{margin-top:12px;text-align:center;font-weight:1000;color:#6b5396;min-height:24px}@media(max-width:850px){.layout{grid-template-columns:1fr}.mirror{min-height:530px}.choices{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:560px){body{padding:7px}.top{align-items:flex-start;flex-direction:column}.choices{grid-template-columns:repeat(3,minmax(0,1fr))}.mirror{min-height:480px}.head{width:180px;height:205px}.eyes{top:82px}.jewelry{top:195px}.outfit{width:220px;height:190px}}
</style>
</head>
<body>
<header class="top"><div><h1>💄 Royal Salon</h1><div style="font-weight:900;color:#81749b;margin-top:4px">Inside Eloriyah’s Castle</div></div><button class="nav" id="backCastle">← Castle</button></header>
<main class="layout">
<section class="panel mirror"><div class="avatar"><div class="head"><div class="hair" id="hair"></div><div class="crown" id="crown">👑</div><div class="eyes">● ●</div><div class="facepaint" id="facepaint"></div></div><div class="neck"></div><div class="jewelry" id="jewelry">💎</div><div class="outfit" id="outfit">✨</div></div></section>
<section class="panel"><div class="tabs" id="tabs"></div><div class="choices" id="choices"></div><button class="save" id="saveLook">Save My Royal Look</button><div class="status" id="status"></div></section>
</main>
<script>
(()=>{
const KEY='elcraft_royal_salon_look_v1';
const categories={
 hair:{label:'💇 Hair',values:[['Natural','#36221f'],['Braids','#241917'],['Purple','#7047aa'],['Pink','#db6599'],['Blue','#3979b9'],['Golden','#d6a83c']]},
 facepaint:{label:'🎨 Face Paint',values:[['None',''],['Stars','✨'],['Heart','❤️'],['Butterfly','🦋'],['Rainbow','🌈'],['Flower','🌸']]},
 crown:{label:'👑 Crowns',values:[['Crown','👑'],['Tiara','💎'],['Flower','🌺'],['Star','⭐'],['Bow','🎀'],['None','']]},
 jewelry:{label:'💍 Jewelry',values:[['Gem','💎'],['Pearls','⚪'],['Heart','💖'],['Star','🌟'],['Flower','🌸'],['None','']]},
 outfit:{label:'👗 Outfits',values:[['Royal','✨','#7555d5'],['Princess','👗','#e85d9b'],['Explorer','🧭','#3c91b9'],['Artist','🎨','#f29b45'],['Musician','🎵','#6646a8'],['Party','🎉','#46ae72']]}
};
let look={hair:'#36221f',facepaint:'',crown:'👑',jewelry:'💎',outfit:'✨',outfitColor:'#7555d5'};
try{look={...look,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}
let active='hair';
const $=id=>document.getElementById(id);
function renderAvatar(){$('hair').style.background=look.hair;$('facepaint').textContent=look.facepaint;$('crown').textContent=look.crown;$('jewelry').textContent=look.jewelry;$('outfit').textContent=look.outfit;$('outfit').style.background=look.outfitColor}
function renderTabs(){const box=$('tabs');box.replaceChildren();Object.entries(categories).forEach(([id,c])=>{const b=document.createElement('button');b.className='tab'+(active===id?' active':'');b.textContent=c.label;b.onclick=()=>{active=id;renderTabs();renderChoices()};box.appendChild(b)})}
function renderChoices(){const box=$('choices');box.replaceChildren();categories[active].values.forEach(value=>{const b=document.createElement('button');b.className='choice';b.type='button';b.textContent=value[0]+' '+(active==='hair'?'●':active==='outfit'?value[1]:value[1]);if(active==='hair')b.style.color=value[1];b.onclick=()=>{if(active==='hair')look.hair=value[1];if(active==='facepaint')look.facepaint=value[1];if(active==='crown')look.crown=value[1];if(active==='jewelry')look.jewelry=value[1];if(active==='outfit'){look.outfit=value[1];look.outfitColor=value[2]}renderAvatar()};box.appendChild(b)})}
$('saveLook').onclick=()=>{localStorage.setItem(KEY,JSON.stringify(look));localStorage.setItem('elcraft_player_style',JSON.stringify(look));$('status').textContent='✨ Your royal look has been saved!'};
$('backCastle').onclick=()=>location.href='castle.html';renderAvatar();renderTabs();renderChoices();
})();
</script>
<script type="module" src="global-navigation.js?v=1"></script>
<script type="module" src="integration-core.js?v=2"></script>
</body>
</html>
