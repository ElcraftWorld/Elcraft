<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8efff">
  <title>ELCraft — Style Studio</title>

  <style>
    *{box-sizing:border-box}
    :root{
      --purple:#7057d8;--purple-dark:#4e3aa9;--purple-light:#efeaff;
      --pink:#ff79ae;--blue:#65c8ee;--green:#78ca5c;
      --ink:#35415f;--muted:#747c98
    }
    html,body{min-height:100%;margin:0}
    body{
      min-height:100vh;color:var(--ink);font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(145deg,#ffe3f1,#eadfff 48%,#dff6ff)
    }
    button{font:inherit;cursor:pointer}
    .page{min-height:100vh;display:flex;flex-direction:column}
    .header{
      min-height:82px;display:flex;align-items:center;justify-content:space-between;
      gap:14px;padding:12px 18px;background:rgba(255,255,255,.96);
      border-bottom:4px solid rgba(111,85,217,.12)
    }
    .header-left{display:flex;align-items:center;gap:13px}
    .back-button{
      border:0;border-radius:999px;padding:11px 17px;color:var(--purple-dark);
      background:var(--purple-light);font-weight:900
    }
    .title-group h1{margin:0;color:var(--purple-dark);font-size:clamp(26px,3vw,42px)}
    .title-group p{margin:4px 0 0;color:var(--muted);font-size:13px;font-weight:800}
    .workspace{
      flex:1;display:grid;
      grid-template-columns:minmax(260px,.8fr) minmax(450px,1.3fr) minmax(250px,.8fr);
      gap:15px;padding:15px
    }
    .panel{
      border:4px solid rgba(255,255,255,.93);border-radius:28px;
      background:rgba(255,255,255,.97);
      box-shadow:0 12px 0 rgba(97,70,144,.08),0 22px 42px rgba(75,61,120,.15)
    }
    .tools,.finish{padding:16px;display:flex;flex-direction:column}
    .panel-title{margin:0 0 8px;color:var(--purple-dark);font-size:23px;text-align:center}
    .tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .tool{
      min-height:79px;border:3px solid #ece7f7;border-radius:18px;
      background:white;color:#4e4b70;font-weight:900
    }
    .tool.active{border-color:var(--pink);background:#fff2f8}
    .tool-icon{display:block;font-size:31px;margin-bottom:5px}
    .stage{
      position:relative;overflow:hidden;min-height:680px;display:grid;place-items:center;
      background:repeating-linear-gradient(135deg,#fff8fc 0 28px,#eef8ff 28px 56px)
    }
    #avatarCanvas{
      position:relative;z-index:2;width:min(100%,500px);touch-action:none
    }
    .missing{
      position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);
      width:min(80%,420px);border:4px solid white;border-radius:24px;padding:22px;
      color:var(--purple-dark);background:white;font-weight:900;line-height:1.5;text-align:center
    }
    .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .swatch{min-height:48px;border:4px solid white;border-radius:15px;box-shadow:0 0 0 2px #dad2eb}
    .swatch.active{box-shadow:0 0 0 5px var(--purple)}
    .actions{display:grid;gap:9px;margin-top:auto;padding-top:14px}
    .action{min-height:50px;border:0;border-radius:16px;color:white;font-weight:900}
    .avatar{background:var(--blue)}
    .save{background:var(--green)}
    .reset{background:var(--pink)}
    @media(max-width:850px){
      .workspace{grid-template-columns:1fr}
      .stage{order:-1;min-height:600px}
    }
  </style>
</head>

<body>
<main class="page">
  <header class="header">
    <div class="header-left">
      <button id="backButton" class="back-button" type="button">← My World</button>
      <div class="title-group">
        <h1>Style Studio</h1>
        <p>Interactive makeup using the same layered character.</p>
      </div>
    </div>
  </header>

  <section class="workspace">
    <aside class="panel tools">
      <h2 class="panel-title">Salon Tools</h2>
      <div id="toolGrid" class="tool-grid"></div>
    </aside>

    <section class="panel stage">
      <canvas id="avatarCanvas" width="600" height="800"></canvas>

      <div id="missingMessage" class="missing" hidden>
        Add the licensed avatar PNG layers inside <strong>assets/avatar</strong>
        before using Style Studio.
      </div>
    </section>

    <aside class="panel finish">
      <h2 class="panel-title">Colors & Finish</h2>
      <div id="colorSwatches" class="swatches"></div>

      <div class="actions">
        <button id="avatarButton" class="action avatar" type="button">🧒 Edit Avatar</button>
        <button id="saveButton" class="action save" type="button">📸 Save Look</button>
        <button id="resetButton" class="action reset" type="button">🧽 Remove Makeup</button>
      </div>
    </aside>
  </section>
</main>

<script type="module">
  import {
    AVATAR_MANIFEST,
    loadAvatarStyle,
    saveAvatarStyle,
    renderAvatarToCanvas,
    saveAvatarImage,
    resetMakeup
  } from "./layered-avatar-engine.js";

  const state=loadAvatarStyle();
  const canvas=document.getElementById("avatarCanvas");
  const toolGrid=document.getElementById("toolGrid");
  const swatches=document.getElementById("colorSwatches");
  const missing=document.getElementById("missingMessage");

  let tool=null;
  let color="#ff4f87";
  let drawing=false;

  const tools=[
    {id:"lipstick",label:"Lipstick",icon:"💄"},
    {id:"mascara",label:"Mascara",icon:"👁️"},
    {id:"blush",label:"Blush",icon:"🖌️"},
    {id:"paint",label:"Face Paint",icon:"🎨"},
    {id:"glitter",label:"Glitter",icon:"✨"},
    {id:"remover",label:"Remover",icon:"🧽"}
  ];

  const colors=["#ff4f87","#d84666","#a64cce","#4f70d9","#3fa7b9","#ff8f45","#f2c84b","#7c4b36"];

  async function render(){
    try{
      missing.hidden=true;
      await renderAvatarToCanvas(canvas,state);
    }catch(error){
      console.error(error);
      missing.hidden=false;
    }
  }

  function renderTools(){
    toolGrid.replaceChildren();

    tools.forEach(item=>{
      const button=document.createElement("button");
      button.type="button";
      button.className=`tool${tool===item.id?" active":""}`;
      button.innerHTML=`<span class="tool-icon">${item.icon}</span>${item.label}`;

      button.onclick=()=>{
        tool=item.id;
        renderTools();
      };

      toolGrid.appendChild(button);
    });
  }

  function renderColors(){
    swatches.replaceChildren();

    colors.forEach(item=>{
      const button=document.createElement("button");
      button.type="button";
      button.className=`swatch${color===item?" active":""}`;
      button.style.background=item;

      button.onclick=()=>{
        color=item;
        renderColors();
      };

      swatches.appendChild(button);
    });
  }

  function point(event){
    const rect=canvas.getBoundingClientRect();

    return{
      x:(event.clientX-rect.left)*(600/rect.width),
      y:(event.clientY-rect.top)*(800/rect.height)
    };
  }

  function inside(point,area){
    return(
      point.x>=area.x-area.width/2 &&
      point.x<=area.x+area.width/2 &&
      point.y>=area.y-area.height/2 &&
      point.y<=area.y+area.height/2
    );
  }

  function apply(point){
    const zones=AVATAR_MANIFEST.makeup;

    if(!tool)return;

    if(tool==="remover"){
      resetMakeup(state);
      render();
      return;
    }

    if(tool==="lipstick"&&inside(point,zones.lipstick)){
      state.makeup.lipstick=color;
    }

    if(tool==="mascara"&&(
      inside(point,zones.leftEye)||
      inside(point,zones.rightEye)
    )){
      state.makeup.mascara=true;
    }

    if(tool==="blush"&&(
      inside(point,zones.leftCheek)||
      inside(point,zones.rightCheek)
    )){
      state.makeup.blush=color;
    }

    if(tool==="paint"){
      state.makeup.facePaint=[
        ...(state.makeup.facePaint||[]),
        {x:point.x,y:point.y,size:6,color}
      ].slice(-30);
    }

    if(tool==="glitter"){
      const marks=Array.from({length:4},()=>({
        x:point.x+(Math.random()-.5)*30,
        y:point.y+(Math.random()-.5)*30,
        size:2+Math.random()*2
      }));

      state.makeup.glitter=[
        ...(state.makeup.glitter||[]),
        ...marks
      ].slice(-60);
    }

    render();
  }

  canvas.onpointerdown=event=>{
    if(!tool)return;
    drawing=true;
    canvas.setPointerCapture(event.pointerId);
    apply(point(event));
  };

  canvas.onpointermove=event=>{
    if(drawing)apply(point(event));
  };

  canvas.onpointerup=event=>{
    drawing=false;
    if(canvas.hasPointerCapture(event.pointerId)){
      canvas.releasePointerCapture(event.pointerId);
    }
  };

  document.getElementById("backButton").onclick=()=>location.href="my-city.html";
  document.getElementById("avatarButton").onclick=()=>location.href="avatar-studio.html";

  document.getElementById("resetButton").onclick=()=>{
    resetMakeup(state);
    render();
  };

  document.getElementById("saveButton").onclick=async()=>{
    try{
      saveAvatarStyle(state);
      await renderAvatarToCanvas(canvas,state);
      await saveAvatarImage(canvas);
    }catch(error){
      console.error(error);
    }
  };

  renderTools();
  renderColors();
  render();
</script>

<script type="module" src="notification-bell.js"></script>
<script type="module" src="parent-gate.js"></script>
</body>
</html>
