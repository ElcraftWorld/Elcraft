<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELCraft — Sky World</title>
<style>
  :root{
    --ink:#17386f;
    --purple:#6848ae;
    --panel:#fffaf3;
    --blue:#47baf2;
    --shadow:0 14px 35px rgba(25,35,85,.20);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden}
  body{
    font-family:Arial,Helvetica,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 50% 15%,rgba(255,255,255,.9),transparent 30%),
      linear-gradient(#57c4f5 0 60%,#c8efff 100%);
  }
  button,input{font:inherit}
  button{cursor:pointer}

  .app{
    min-height:100vh;
    display:grid;
    grid-template-rows:auto 1fr;
    position:relative;
    overflow:hidden;
  }

  .cloud{
    position:absolute;
    z-index:0;
    opacity:.5;
    filter:blur(.2px);
    animation:drift 25s linear infinite;
    pointer-events:none;
  }
  .cloud.c1{top:10%;left:-12%;font-size:90px}
  .cloud.c2{top:24%;left:70%;font-size:72px;animation-duration:34s}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(125vw)}}

  header{
    position:relative;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:12px 18px;
    background:rgba(255,255,255,.9);
    border-bottom:2px solid rgba(255,255,255,.85);
    box-shadow:0 7px 22px rgba(21,43,94,.14);
    backdrop-filter:blur(10px);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }
  .back{
    border:0;
    border-radius:17px;
    background:#eee5ff;
    color:#5d3fa4;
    padding:11px 15px;
    font-weight:900;
  }
  .title-wrap h1{
    margin:0;
    color:#5e45a8;
    font-size:clamp(22px,3vw,36px);
    line-height:1;
  }
  .title-wrap p{
    margin:3px 0 0;
    color:#577099;
    font-size:13px;
    font-weight:700;
  }
  .player{
    display:flex;
    align-items:center;
    gap:9px;
    background:#f4edff;
    border-radius:999px;
    padding:8px 14px;
    color:#6145a5;
    font-weight:900;
    white-space:nowrap;
  }

  .workspace{
    position:relative;
    z-index:2;
    min-height:0;
    display:grid;
    grid-template-columns:250px minmax(0,1fr) 235px;
    gap:14px;
    padding:14px;
  }

  .panel{
    min-height:0;
    overflow:auto;
    border:2px solid rgba(255,255,255,.9);
    border-radius:26px;
    background:rgba(255,250,243,.95);
    box-shadow:var(--shadow);
    padding:16px;
  }
  .panel h2{
    margin:0 0 12px;
    color:#5f45a6;
    font-size:19px;
  }
  .section-label{
    margin:16px 0 8px;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-weight:900;
    color:#7181a3;
  }

  .template-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }
  .template-btn{
    min-height:78px;
    border:3px solid transparent;
    border-radius:17px;
    background:#eaf7ff;
    color:#264675;
    font-weight:900;
    padding:8px;
  }
  .template-btn span{
    display:block;
    font-size:28px;
    margin-bottom:3px;
  }
  .template-btn.active{
    border-color:#7653c2;
    background:#eee6ff;
  }

  .tool-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }
  .tool{
    border:2px solid #e0d5ef;
    border-radius:15px;
    background:#fff;
    padding:10px 7px;
    color:#334675;
    font-weight:900;
  }
  .tool.active{
    border-color:#704db9;
    background:#eee6ff;
    color:#5e3ea3;
  }

  .colors{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
  }
  .color{
    aspect-ratio:1;
    border:3px solid white;
    border-radius:50%;
    box-shadow:0 3px 8px rgba(26,37,81,.2);
  }
  .color.active{outline:4px solid #6547aa;outline-offset:2px}

  .range-row label{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:13px;
    font-weight:800;
    color:#4c6188;
  }
  input[type=range]{width:100%;margin-top:9px}

  .canvas-zone{
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .canvas-toolbar{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    gap:9px;
    padding:10px;
    background:rgba(255,255,255,.9);
    border:2px solid rgba(255,255,255,.95);
    border-radius:21px;
    box-shadow:var(--shadow);
  }
  .toolbar-group{display:flex;flex-wrap:wrap;gap:8px}
  .mini{
    border:0;
    border-radius:13px;
    background:#eee6ff;
    color:#5e42a3;
    padding:9px 12px;
    font-weight:900;
  }
  .mini.danger{background:#ffe6ec;color:#a53c5d}

  .paper-shell{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:12px;
    border:2px solid rgba(255,255,255,.85);
    border-radius:30px;
    background:rgba(240,249,255,.56);
    box-shadow:inset 0 0 30px rgba(53,141,200,.15),var(--shadow);
  }
  .paper{
    position:relative;
    width:min(100%,calc((100vh - 175px) * 1.28));
    aspect-ratio:4/3;
    border:9px solid white;
    border-radius:24px;
    overflow:hidden;
    background:white;
    box-shadow:0 18px 40px rgba(22,48,98,.24);
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
    cursor:crosshair;
  }

  .sticker-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
  }
  .sticker{
    border:2px solid #e4d9ee;
    border-radius:15px;
    background:#fff;
    min-height:58px;
    font-size:30px;
  }
  .sticker.active{
    border-color:#734fb8;
    background:#eee6ff;
  }

  .save{
    width:100%;
    border:0;
    border-radius:18px;
    background:linear-gradient(#88d847,#62b72b);
    color:#fff;
    padding:14px;
    font-weight:900;
    font-size:17px;
    box-shadow:0 6px 0 #468e20;
  }
  .download{
    width:100%;
    margin-top:10px;
    border:0;
    border-radius:18px;
    background:#6f4eba;
    color:#fff;
    padding:13px;
    font-weight:900;
    box-shadow:0 6px 0 #4f368b;
  }
  .status{
    margin-top:12px;
    min-height:36px;
    border-radius:15px;
    background:#edf7ff;
    color:#49628c;
    padding:10px;
    font-size:13px;
    font-weight:800;
  }
  .gallery-preview{
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    display:none;
    margin-top:10px;
    border:4px solid white;
    border-radius:16px;
    box-shadow:0 7px 16px rgba(28,42,86,.18);
  }

  @media(max-width:1000px){
    html,body{overflow:auto}
    .app{min-height:100vh}
    .workspace{
      grid-template-columns:1fr;
      overflow:visible;
    }
    .canvas-zone{min-height:620px;order:1}
    .left-panel{order:2}
    .right-panel{order:3}
    .template-grid{grid-template-columns:repeat(3,1fr)}
    .tool-grid{grid-template-columns:repeat(4,1fr)}
    .sticker-grid{grid-template-columns:repeat(6,1fr)}
    .paper{width:min(100%,760px)}
  }
  @media(max-width:560px){
    header{padding:9px}
    .title-wrap p{display:none}
    .player{font-size:12px;padding:7px 10px}
    .workspace{padding:8px;gap:9px}
    .canvas-zone{min-height:480px}
    .paper{border-width:5px;border-radius:17px}
    .template-grid{grid-template-columns:repeat(2,1fr)}
    .tool-grid{grid-template-columns:repeat(2,1fr)}
    .sticker-grid{grid-template-columns:repeat(4,1fr)}
  }
</style>
</head>
<body>
<div class="app">
  <div class="cloud c1">☁️</div>
  <div class="cloud c2">☁️</div>

  <header>
    <div class="brand">
      <button class="back" id="backBtn">← Home</button>
      <div class="title-wrap">
        <h1>🌤️ Sky World Studio</h1>
        <p>Draw freely or choose a magical template.</p>
      </div>
    </div>
    <div class="player">✨ <span id="playerName">Player</span>'s Art</div>
  </header>

  <main class="workspace">
    <aside class="panel left-panel">
      <h2>Choose a starting picture</h2>
      <div class="template-grid">
        <button class="template-btn active" data-template="blank"><span>🖼️</span>Blank</button>
        <button class="template-btn" data-template="rainbow"><span>🌈</span>Rainbow</button>
        <button class="template-btn" data-template="castle"><span>🏰</span>Castle</button>
        <button class="template-btn" data-template="clouds"><span>☁️</span>Clouds</button>
        <button class="template-btn" data-template="stars"><span>⭐</span>Stars</button>
        <button class="template-btn" data-template="garden"><span>🌸</span>Garden</button>
      </div>

      <div class="section-label">Drawing tools</div>
      <div class="tool-grid">
        <button class="tool active" data-tool="brush">🖌️ Brush</button>
        <button class="tool" data-tool="marker">🖍️ Marker</button>
        <button class="tool" data-tool="eraser">🧽 Eraser</button>
        <button class="tool" data-tool="sticker">✨ Sticker</button>
      </div>

      <div class="section-label">Paint colors</div>
      <div class="colors" id="colors"></div>

      <div class="section-label">Brush size</div>
      <div class="range-row">
        <label for="sizeRange"><span>Small</span><strong id="sizeValue">12</strong><span>Big</span></label>
        <input id="sizeRange" type="range" min="3" max="48" value="12">
      </div>
    </aside>

    <section class="canvas-zone">
      <div class="canvas-toolbar">
        <div class="toolbar-group">
          <button class="mini" id="undoBtn">↶ Undo</button>
          <button class="mini" id="redoBtn">↷ Redo</button>
        </div>
        <div class="toolbar-group">
          <button class="mini" id="newBtn">✨ New Picture</button>
          <button class="mini danger" id="clearBtn">🗑️ Clear Drawing</button>
        </div>
      </div>

      <div class="paper-shell">
        <div class="paper">
          <canvas id="canvas" width="1200" height="900" aria-label="Drawing canvas"></canvas>
        </div>
      </div>
    </section>

    <aside class="panel right-panel">
      <h2>Fun stickers</h2>
      <div class="sticker-grid">
        <button class="sticker active" data-sticker="⭐">⭐</button>
        <button class="sticker" data-sticker="🌈">🌈</button>
        <button class="sticker" data-sticker="☁️">☁️</button>
        <button class="sticker" data-sticker="🦋">🦋</button>
        <button class="sticker" data-sticker="🌸">🌸</button>
        <button class="sticker" data-sticker="🦄">🦄</button>
        <button class="sticker" data-sticker="🐶">🐶</button>
        <button class="sticker" data-sticker="💖">💖</button>
        <button class="sticker" data-sticker="✨">✨</button>
      </div>

      <div class="section-label">Keep your creation</div>
      <button class="save" id="saveBtn">💾 Save to My Gallery</button>
      <button class="download" id="downloadBtn">⬇️ Download Picture</button>
      <div class="status" id="status">Choose a template or begin drawing.</div>
      <img id="galleryPreview" class="gallery-preview" alt="Latest saved drawing">
    </aside>
  </main>
</div>

<script>
(() => {
  const NAME_KEY = 'elcraft_child_name';
  const GALLERY_KEY = 'elcraft_sky_world_latest';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  const status = document.getElementById('status');
  const preview = document.getElementById('galleryPreview');
  const playerName = localStorage.getItem(NAME_KEY) || 'Player';
  document.getElementById('playerName').textContent = playerName;

  const palette = ['#172b75','#4a69d8','#31b7ee','#48c879','#92d63c','#ffd43b','#ff9b38','#f05454','#ec62a5','#9b5de5','#ffffff','#302a38'];
  const colorsEl = document.getElementById('colors');

  let activeColor = '#4a69d8';
  let activeTool = 'brush';
  let activeSticker = '⭐';
  let brushSize = 12;
  let drawing = false;
  let lastPoint = null;
  let currentTemplate = 'blank';
  let history = [];
  let historyIndex = -1;
  let templateImage = null;

  palette.forEach((color,i) => {
    const btn = document.createElement('button');
    btn.className = 'color' + (i === 1 ? ' active' : '');
    btn.style.background = color;
    btn.dataset.color = color;
    btn.setAttribute('aria-label','Paint color ' + color);
    btn.addEventListener('click',() => {
      activeColor = color;
      document.querySelectorAll('.color').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
    colorsEl.appendChild(btn);
  });

  function canvasPoint(event){
    const rect = canvas.getBoundingClientRect();
    return {
      x:(event.clientX - rect.left) * canvas.width / rect.width,
      y:(event.clientY - rect.top) * canvas.height / rect.height
    };
  }

  function drawTemplate(name){
    currentTemplate = name;
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    if(name === 'blank'){
      ctx.restore();
      templateImage = ctx.getImageData(0,0,canvas.width,canvas.height);
      resetHistory();
      return;
    }

    ctx.lineWidth = 8;
    ctx.strokeStyle = '#7c8ca8';
    ctx.fillStyle = '#f7fbff';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if(name === 'rainbow'){
      ctx.fillStyle = '#dff4ff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle = '#9aa8bd';
      [280,235,190,145,100].forEach((r,index) => {
        ctx.lineWidth = 23;
        ctx.beginPath();
        ctx.arc(600,600,r,Math.PI,0);
        ctx.stroke();
      });
      drawCloud(320,600,1.25);
      drawCloud(880,600,1.25);
      ctx.strokeStyle='#8e9cb1';ctx.lineWidth=7;
      ctx.beginPath();ctx.moveTo(0,720);ctx.quadraticCurveTo(250,650,460,735);ctx.quadraticCurveTo(730,820,1200,690);ctx.stroke();
    }

    if(name === 'castle'){
      ctx.fillStyle='#e9f7ff';ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle='#8190a8';ctx.lineWidth=8;
      ctx.strokeRect(390,380,420,310);
      ctx.strokeRect(300,330,150,360);
      ctx.strokeRect(750,330,150,360);
      triangle(300,330,375,220,450,330);
      triangle(750,330,825,220,900,330);
      triangle(390,380,600,215,810,380);
      ctx.beginPath();ctx.arc(600,690,70,Math.PI,0);ctx.stroke();
      [350,500,700,850].forEach(x => {ctx.strokeRect(x,450,55,75)});
      ctx.beginPath();ctx.moveTo(0,740);ctx.quadraticCurveTo(260,690,490,755);ctx.quadraticCurveTo(840,835,1200,720);ctx.stroke();
      drawCloud(195,170,.8);drawCloud(990,150,.9);
    }

    if(name === 'clouds'){
      ctx.fillStyle='#dff5ff';ctx.fillRect(0,0,canvas.width,canvas.height);
      drawCloud(250,250,1.15);
      drawCloud(650,180,.8);
      drawCloud(930,330,1.3);
      drawCloud(470,540,1);
      ctx.strokeStyle='#8798b0';ctx.lineWidth=7;
      ctx.beginPath();ctx.arc(600,700,115,0,Math.PI*2);ctx.stroke();
      for(let i=0;i<12;i++){
        const a=i*Math.PI/6;
        ctx.beginPath();ctx.moveTo(600+145*Math.cos(a),700+145*Math.sin(a));ctx.lineTo(600+190*Math.cos(a),700+190*Math.sin(a));ctx.stroke();
      }
    }

    if(name === 'stars'){
      ctx.fillStyle='#eaf2ff';ctx.fillRect(0,0,canvas.width,canvas.height);
      const pts=[[180,190,55],[430,300,38],[770,180,50],[1000,310,40],[260,570,42],[600,520,65],[930,610,54]];
      pts.forEach(([x,y,r])=>drawStar(x,y,r));
      ctx.strokeStyle='#8a98ad';ctx.lineWidth=7;
      ctx.beginPath();ctx.arc(620,360,130,.45,Math.PI*1.65);ctx.stroke();
    }

    if(name === 'garden'){
      ctx.fillStyle='#f5fbff';ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle='#8495aa';ctx.lineWidth=7;
      ctx.beginPath();ctx.moveTo(0,660);ctx.quadraticCurveTo(280,590,540,675);ctx.quadraticCurveTo(830,765,1200,640);ctx.stroke();
      [[180,600],[350,690],[520,580],[700,670],[890,560],[1050,680]].forEach(([x,y],i)=>drawFlower(x,y,42+(i%2)*8));
      drawCloud(250,190,.8);drawCloud(920,165,.9);
      ctx.beginPath();ctx.arc(620,275,90,0,Math.PI*2);ctx.stroke();
      for(let i=0;i<10;i++){const a=i*Math.PI/5;ctx.beginPath();ctx.moveTo(620+110*Math.cos(a),275+110*Math.sin(a));ctx.lineTo(620+155*Math.cos(a),275+155*Math.sin(a));ctx.stroke();}
    }

    ctx.restore();
    templateImage = ctx.getImageData(0,0,canvas.width,canvas.height);
    resetHistory();
    status.textContent = name === 'blank' ? 'Blank canvas ready!' : 'Template ready — color it your way!';
  }

  function triangle(x1,y1,x2,y2,x3,y3){
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.closePath();ctx.stroke();
  }

  function drawCloud(x,y,s){
    ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle='#8798b0';ctx.lineWidth=7;
    ctx.beginPath();
    ctx.moveTo(-105,30);
    ctx.bezierCurveTo(-125,-25,-65,-60,-25,-35);
    ctx.bezierCurveTo(-10,-95,85,-85,88,-28);
    ctx.bezierCurveTo(145,-25,155,55,95,65);
    ctx.lineTo(-75,65);
    ctx.bezierCurveTo(-125,60,-145,35,-105,30);
    ctx.stroke();ctx.restore();
  }

  function drawStar(x,y,r){
    ctx.save();ctx.translate(x,y);ctx.strokeStyle='#8392a8';ctx.lineWidth=7;
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const radius=i%2===0?r:r*.43;
      const a=-Math.PI/2+i*Math.PI/5;
      const px=Math.cos(a)*radius,py=Math.sin(a)*radius;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath();ctx.stroke();ctx.restore();
  }

  function drawFlower(x,y,r){
    ctx.save();ctx.translate(x,y);ctx.strokeStyle='#8495aa';ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(0,10);ctx.lineTo(0,110);ctx.stroke();
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3;
      ctx.beginPath();ctx.ellipse(Math.cos(a)*r*.62,Math.sin(a)*r*.62,r*.45,r*.25,a,0,Math.PI*2);ctx.stroke();
    }
    ctx.beginPath();ctx.arc(0,0,r*.28,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }

  function startDraw(event){
    if(activeTool === 'sticker'){
      const p=canvasPoint(event);
      ctx.font = `${Math.max(36,brushSize*4)}px Arial`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(activeSticker,p.x,p.y);
      pushHistory();
      return;
    }
    drawing=true;
    lastPoint=canvasPoint(event);
    canvas.setPointerCapture?.(event.pointerId);
  }

  function moveDraw(event){
    if(!drawing)return;
    const p=canvasPoint(event);
    ctx.save();
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=activeTool==='marker'?brushSize*1.8:brushSize;
    ctx.globalAlpha=activeTool==='marker'?.42:1;
    ctx.strokeStyle=activeTool==='eraser'?'#ffffff':activeColor;
    ctx.beginPath();ctx.moveTo(lastPoint.x,lastPoint.y);ctx.lineTo(p.x,p.y);ctx.stroke();
    ctx.restore();
    lastPoint=p;
  }

  function endDraw(){
    if(!drawing)return;
    drawing=false;
    lastPoint=null;
    pushHistory();
  }

  function resetHistory(){
    history=[canvas.toDataURL('image/png')];
    historyIndex=0;
  }

  function pushHistory(){
    history=history.slice(0,historyIndex+1);
    history.push(canvas.toDataURL('image/png'));
    if(history.length>35)history.shift();
    historyIndex=history.length-1;
  }

  function restoreHistory(index){
    const img=new Image();
    img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0)};
    img.src=history[index];
  }

  canvas.addEventListener('pointerdown',startDraw);
  canvas.addEventListener('pointermove',moveDraw);
  canvas.addEventListener('pointerup',endDraw);
  canvas.addEventListener('pointercancel',endDraw);
  canvas.addEventListener('pointerleave',endDraw);

  document.querySelectorAll('.template-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(history.length>1 && !confirm('Start a new template? Your unsaved drawing will be replaced.'))return;
      document.querySelectorAll('.template-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      drawTemplate(btn.dataset.template);
    });
  });

  document.querySelectorAll('.tool').forEach(btn=>{
    btn.addEventListener('click',()=>{
      activeTool=btn.dataset.tool;
      document.querySelectorAll('.tool').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      status.textContent=activeTool==='sticker'?'Tap the picture to place your sticker.':activeTool.charAt(0).toUpperCase()+activeTool.slice(1)+' selected.';
    });
  });

  document.querySelectorAll('.sticker').forEach(btn=>{
    btn.addEventListener('click',()=>{
      activeSticker=btn.dataset.sticker;
      activeTool='sticker';
      document.querySelectorAll('.sticker').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool==='sticker'));
      status.textContent='Tap the picture to add '+activeSticker;
    });
  });

  document.getElementById('sizeRange').addEventListener('input',e=>{
    brushSize=Number(e.target.value);
    document.getElementById('sizeValue').textContent=brushSize;
  });

  document.getElementById('undoBtn').addEventListener('click',()=>{
    if(historyIndex>0){historyIndex--;restoreHistory(historyIndex);status.textContent='Undid the last change.'}
  });
  document.getElementById('redoBtn').addEventListener('click',()=>{
    if(historyIndex<history.length-1){historyIndex++;restoreHistory(historyIndex);status.textContent='Brought the change back.'}
  });

  document.getElementById('clearBtn').addEventListener('click',()=>{
    if(!confirm('Clear your drawing but keep the template?'))return;
    if(templateImage)ctx.putImageData(templateImage,0,0);
    pushHistory();
    status.textContent='Drawing cleared. The template is still here.';
  });

  document.getElementById('newBtn').addEventListener('click',()=>{
    if(!confirm('Start a brand-new blank picture?'))return;
    document.querySelectorAll('.template-btn').forEach(b=>b.classList.toggle('active',b.dataset.template==='blank'));
    drawTemplate('blank');
  });

  document.getElementById('saveBtn').addEventListener('click',()=>{
    try{
      const data=canvas.toDataURL('image/jpeg',.82);
      localStorage.setItem(GALLERY_KEY,data);
      preview.src=data;
      preview.style.display='block';
      status.textContent='Saved to '+playerName+"'s Sky World gallery! ✨";
    }catch(err){
      status.textContent='This picture is too large to save in this browser, but you can still download it.';
    }
  });

  document.getElementById('downloadBtn').addEventListener('click',()=>{
    const link=document.createElement('a');
    link.download=(playerName+'-sky-world-art.png').replace(/\s+/g,'-').toLowerCase();
    link.href=canvas.toDataURL('image/png');
    link.click();
    status.textContent='Picture downloaded!';
  });

  document.getElementById('backBtn').addEventListener('click',()=>{window.location.href='index.html'});

  const latest=localStorage.getItem(GALLERY_KEY);
  if(latest){preview.src=latest;preview.style.display='block'}

  drawTemplate('blank');
})();
</script>
</body>
</html>
