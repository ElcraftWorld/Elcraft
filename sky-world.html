<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a174d">
<title>ELCraft Art Studio</title>
<!-- Safe Art Studio build: no missing-page routes -->
<link rel="preload" as="image" href="art-studio-background.png?v=2">
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
:root{--purple:#7758df;--dark:#4e3ca6;--header:68px}
body{overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#1b102d;color:#34375b}
button{font:inherit;cursor:pointer}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:radial-gradient(circle at 50% 30%,#593978,#1a0e2a 75%)}
.topbar{min-height:var(--header);z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px max(13px,env(safe-area-inset-right)) 9px max(13px,env(safe-area-inset-left));color:#fff;background:linear-gradient(#352061,#1d1038);box-shadow:0 7px 0 #10091f66}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-icon{font-size:34px}.brand h1{margin:0;font-size:clamp(20px,3vw,31px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand p{margin:4px 0 0;font-size:10px;font-weight:900;color:#ffffffc7}
.actions{display:flex;gap:8px;align-items:center}.pill{min-height:41px;border:3px solid #ffffffb8;border-radius:14px;padding:8px 11px;color:#fff;background:#ffffff17;font-size:11px;font-weight:1000}
.shell{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:clamp(4px,1vw,11px)}
.stage{position:relative;width:min(100%,calc(100dvh - var(--header) - clamp(8px,2vw,22px)));max-height:100%;aspect-ratio:1/1;overflow:hidden;border:clamp(2px,.35vw,6px) solid #ffffff28;border-radius:clamp(8px,1vw,16px);background:#eea17e url("art-studio-background.png?v=2") center/100% 100% no-repeat;box-shadow:0 22px 55px #0804146b}
.hotspot{position:absolute;z-index:10;border:3px solid transparent;border-radius:18px;background:transparent;transition:.16s}
.hotspot:hover,.hotspot:focus-visible{border-color:#ffe56f;background:#fff3a422;box-shadow:0 0 0 5px #7758df35,0 0 28px #ffdd5c7d;outline:none;transform:translateY(-2px)}
.hotspot:after{content:attr(data-label);position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:none;min-width:max-content;border:3px solid #fff;border-radius:999px;padding:7px 11px;color:#fff;background:linear-gradient(145deg,#7758df,#4e3ca6);font-size:10px;font-weight:1000;white-space:nowrap}
.hotspot:hover:after,.hotspot:focus-visible:after{display:block}
.inspiration{left:0;top:20%;width:19%;height:55%}.painting{left:15%;top:43%;width:21%;height:39%}.gallery{left:22%;top:28%;width:48%;height:28%}.crafts{left:34%;top:52%;width:28%;height:27%}.digital{left:61%;top:45%;width:35%;height:34%}.drawing{left:0;top:70%;width:30%;height:28%}.supplies{left:73%;top:71%;width:27%;height:28%}.challenge{left:26%;top:72%;width:51%;height:27%}
.tip{position:absolute;left:50%;bottom:clamp(5px,1.2%,13px);z-index:20;transform:translateX(-50%);width:min(680px,calc(100% - 22px));border:4px solid #ffffffe8;border-radius:999px;padding:8px 14px;color:#fff;background:#27143ee3;font-size:10px;font-weight:900;text-align:center;backdrop-filter:blur(7px)}
.modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:18px;background:#140b27ad;backdrop-filter:blur(9px)}.modal.visible{display:flex}
.panel{width:min(570px,100%);max-height:min(88vh,760px);overflow:auto;border:6px solid #fff;border-radius:30px;padding:20px;background:linear-gradient(145deg,#f8efff,#fff9e9);box-shadow:0 30px 72px #130a266b}
.panel-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panel h2{margin:0;color:var(--dark);font-size:clamp(24px,4vw,35px)}.close{width:44px;height:44px;border:0;border-radius:50%;color:#fff;background:var(--purple);font-size:22px;font-weight:1000}
.icon{text-align:center;font-size:78px}.message{border:4px solid #e8ddff;border-radius:20px;padding:17px;color:var(--dark);background:#fff;font-size:14px;font-weight:900;line-height:1.55}
.list{display:grid;gap:9px;margin-top:12px}.row{border:3px solid #e9e3f7;border-radius:15px;padding:11px;background:#fff;font-size:11px;font-weight:900}
.modal-actions{display:flex;gap:9px;margin-top:14px}.modal-actions button{flex:1;border:0;border-radius:16px;padding:13px;font-weight:1000}.cancel{color:#63499b;background:#e9e4f4}.enter{color:#fff;background:linear-gradient(#8bd84d,#59ad28);box-shadow:0 5px 0 #438b1d}
@media(max-width:1000px){:root{--header:61px}.topbar{padding:7px 9px}.brand-icon{font-size:28px}.brand h1{font-size:clamp(18px,3.4vw,25px)}.brand p,.actions .stat{display:none}.pill{min-height:37px;padding:7px 9px}.tip{font-size:8px;padding:6px 10px}.hotspot:after{font-size:8px;padding:5px 8px}}
@media(max-width:700px){:root{--header:55px}.brand-icon{font-size:23px}.brand h1{font-size:17px}.actions{display:none}.shell{padding:4px}.hotspot:after,.tip{display:none!important}.modal-actions{flex-direction:column}}
@media(orientation:portrait) and (max-width:700px){.shell{align-items:flex-start;padding-top:7px}.stage{width:calc(100vw - 8px);height:auto}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">
    <div class="brand-icon">🎨</div>
    <div><h1>ELCraft Art Studio</h1><p id="artistName">Loading artist...</p></div>
  </div>
  <div class="actions">
    <div class="pill stat">🪙 <span id="coins">0</span></div>
    <div class="pill stat">⭐ <span id="xp">0</span> XP</div>
    <button id="galleryTop" class="pill" type="button">🖼️ My Gallery</button>
    <button id="cityTop" class="pill" type="button">🏙️ My City</button>
  </div>
</header>

<main class="shell">
<section class="stage" aria-label="Interactive ELCraft Art Studio">
  <button class="hotspot inspiration" data-feature="inspiration" data-label="📚 Inspiration Shelf" aria-label="Inspiration Shelf"></button>
  <button class="hotspot painting" data-feature="painting" data-label="🎨 Painting Easels" aria-label="Painting Easels"></button>
  <button class="hotspot gallery" data-feature="gallery" data-label="🖼️ My Gallery" aria-label="My Gallery"></button>
  <button class="hotspot crafts" data-feature="crafts" data-label="✂️ Craft Station" aria-label="Craft Station"></button>
  <button class="hotspot digital" data-feature="digital" data-label="💻 Digital Art" aria-label="Digital Art"></button>
  <button class="hotspot drawing" data-feature="drawing" data-label="✏️ Drawing Table" aria-label="Drawing Table"></button>
  <button class="hotspot supplies" data-feature="supplies" data-label="🖌️ Art Supplies" aria-label="Art Supplies"></button>
  <button class="hotspot challenge" data-feature="challenge" data-label="✨ Creative Challenge" aria-label="Creative Challenge"></button>
  <div class="tip">💡 Click any art station to paint, draw, create, or explore.</div>
</section>
</main>
</div>

<section id="featureModal" class="modal" role="dialog" aria-modal="true">
<div class="panel">
  <div class="panel-top"><h2 id="featureTitle">Art Studio</h2><button class="close" data-close="featureModal" type="button">×</button></div>
  <div id="featureIcon" class="icon">🎨</div>
  <div id="featureMessage" class="message"></div>
  <div id="featureList" class="list"></div>
  <div class="modal-actions">
    <button class="cancel" data-close="featureModal" type="button">Maybe Later</button>
    <button id="enterFeature" class="enter" type="button">Start Creating</button>
  </div>
</div>
</section>

<section id="infoModal" class="modal" role="dialog" aria-modal="true">
<div class="panel">
  <div class="panel-top"><h2>Art Studio</h2><button class="close" data-close="infoModal" type="button">×</button></div>
  <div class="message">This Art Studio station is ready to be built and connected.</div>
</div>
</section>

<script>
(() => {
  const childName = localStorage.getItem("elcraft_child_name") || "Artist";
  let profile = {coins:Number(localStorage.getItem("elcraft_coins")||0),xp:0};
  try{profile={...profile,...JSON.parse(localStorage.getItem("elcraft_profile_v1")||"{}")}}catch{}

  const features = {
    painting:{icon:"🎨",title:"Painting Easels",message:`Choose an easel and create a colorful masterpiece, ${childName}!`,items:["Free painting","Coloring pages","Brushes, stamps, and shapes"],route:null},
    drawing:{icon:"✏️",title:"Drawing Table",message:"Draw with pencils, crayons, markers, and shapes.",items:["Free draw","Tracing","Learn to draw"],route:null},
    digital:{icon:"💻",title:"Digital Art Desk",message:"Create digital pictures and decorate scenes.",items:["Digital canvas","Pixel art","Stickers and backgrounds"],route:null},
    crafts:{icon:"✂️",title:"Craft Station",message:"Build paper crafts, clay creations, and collages.",items:["Paper crafts","Clay and sculpture","Collages"],route:null},
    gallery:{icon:"🖼️",title:"My Art Gallery",message:"See every masterpiece saved from the Art Studio.",items:["Saved paintings","Saved drawings","Favorite creations"],route:null},
    inspiration:{icon:"📚",title:"Inspiration Shelf",message:"Explore art ideas and simple drawing lessons.",items:["Color ideas","Art inspiration","Step-by-step lessons"],route:null},
    supplies:{icon:"🖌️",title:"Art Supply Shelf",message:"Explore brushes, paints, stamps, and creative tools.",items:["Brush collection","Color palettes","Stamps and stickers"],route:null},
    challenge:{icon:"✨",title:"Creative Challenge",message:`Welcome, ${childName}! Choose a station and make something special.`,items:["Try a new color","Draw from imagination","Save art to your gallery"],route:null}
  };

  let active = null;
  const $ = id => document.getElementById(id);
  $("artistName").textContent = `${childName}'s Creative Studio`;
  $("coins").textContent = Number(profile.coins||0);
  $("xp").textContent = Number(profile.xp||0);

  function open(id){$(id)?.classList.add("visible")}
  function close(id){$(id)?.classList.remove("visible")}
  function showFeature(feature){
    active=feature;
    $("featureTitle").textContent=feature.title;
    $("featureIcon").textContent=feature.icon;
    $("featureMessage").textContent=feature.message;
    $("featureList").replaceChildren();
    feature.items.forEach(item=>{
      const row=document.createElement("div");
      row.className="row";
      row.textContent=`✨ ${item}`;
      $("featureList").appendChild(row);
    });
    $("enterFeature").textContent =
      feature.route
        ? (feature.title === "My Art Gallery" ? "Open Gallery" : "Start Creating")
        : "See This Station";
    open("featureModal");
  }

  document.querySelectorAll("[data-feature]").forEach(button=>{
    button.addEventListener("click",()=>showFeature(features[button.dataset.feature]));
  });
  $("galleryTop").addEventListener("click",()=>showFeature(features.gallery));
  $("cityTop").addEventListener("click",()=>{
    location.href = "my-city.html";
  });
  $("enterFeature").addEventListener("click",()=>{
    if(!active){
      return;
    }

    if(active.route){
      location.href=active.route;
      return;
    }

    close("featureModal");

    $("infoModal").querySelector("h2").textContent =
      `${active.icon} ${active.title}`;

    $("infoModal").querySelector(".message").textContent =
      `${active.title} is safely connected to the new Art Studio, but its creative activity has not been built yet. We can build this station next without sending the child to a missing page.`;

    open("infoModal");
  });
  document.querySelectorAll("[data-close]").forEach(button=>button.addEventListener("click",()=>close(button.dataset.close)));
  document.querySelectorAll(".modal").forEach(modal=>modal.addEventListener("click",event=>{if(event.target===modal)close(modal.id)}));

  const image = new Image();
  image.onerror=()=>{
    $("infoModal").querySelector("h2").textContent =
      "Art Studio artwork missing";

    $("infoModal").querySelector(".message").textContent =
      "Upload art-studio-background.png in the same folder as sky-world.html, then refresh the page.";

    open("infoModal");
  };
  image.src="art-studio-background.png?v=2";

  function syncHeader(){
    const header=document.querySelector(".topbar");
    if(header)document.documentElement.style.setProperty("--header",`${Math.ceil(header.getBoundingClientRect().height)}px`);
  }
  addEventListener("resize",syncHeader);
  addEventListener("orientationchange",()=>setTimeout(syncHeader,180));
  syncHeader();
})();
</script>

<script type="module" src="notification-bell.js"></script>
<script type="module" src="global-navigation.js?v=1"></script>
</body>
</html>
