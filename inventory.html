<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#745ee8">

  <title>My Backpack | ELCraft</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --purple: #745ee8;
      --purple-dark: #4f3db4;
      --purple-light: #eeeaff;
      --sky: #81d5ff;
      --gold: #ffd45d;
      --ink: #34385d;
      --muted: #7f84a2;
      --white: #ffffff;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;

      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at top left,
          rgba(255, 255, 255, 0.9),
          transparent 34%
        ),
        linear-gradient(
          145deg,
          #a9e4ff,
          #d6c8ff 48%,
          #ffe6a5
        );
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(1200px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 34px;
    }

    .topbar {
      position: sticky;
      top: 12px;
      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      border: 3px solid rgba(255, 255, 255, 0.8);
      border-radius: 22px;
      padding: 12px 14px;

      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);

      box-shadow:
        0 12px 30px rgba(59, 61, 116, 0.18);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 34px;
    }

    .brand h1 {
      margin: 0;

      color: var(--purple-dark);
      font-size: clamp(20px, 4vw, 30px);
    }

    .brand p {
      margin: 2px 0 0;

      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .top-button {
      border: 0;
      border-radius: 13px;
      padding: 10px 13px;

      color: var(--purple-dark);
      background: var(--purple-light);

      font-size: 12px;
      font-weight: 900;
    }

    .top-button.primary {
      color: white;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          #9477ff
        );
    }

    .hero {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;

      margin-top: 22px;
    }

    .hero-card,
    .stats-card {
      border: 4px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;
      padding: 23px;

      background: rgba(255, 255, 255, 0.91);

      box-shadow:
        0 18px 40px rgba(60, 65, 118, 0.2);
    }

    .hero-card {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .backpack {
      flex: 0 0 auto;

      font-size: clamp(70px, 12vw, 115px);

      filter:
        drop-shadow(
          0 10px 8px rgba(61, 54, 113, 0.18)
        );
    }

    .hero h2 {
      margin: 0;

      color: var(--purple-dark);
      font-size: clamp(25px, 5vw, 42px);
    }

    .hero-copy {
      margin: 8px 0 0;

      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.5;
    }

    .stats-card {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      border: 2px solid #ebe7fb;
      border-radius: 17px;
      padding: 14px;

      background: white;

      text-align: center;
    }

    .stat-value {
      color: var(--purple);
      font-size: 25px;
      font-weight: 900;
    }

    .stat-label {
      margin-top: 3px;

      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
    }

    .toolbar {
      display: grid;
      grid-template-columns:
        minmax(220px, 1fr)
        auto;
      gap: 12px;

      margin-top: 18px;
    }

    .search {
      width: 100%;

      border: 3px solid rgba(255, 255, 255, 0.85);
      border-radius: 16px;
      padding: 13px 15px;

      outline: none;

      color: var(--ink);
      background: rgba(255, 255, 255, 0.92);

      box-shadow:
        0 8px 20px rgba(70, 74, 128, 0.13);

      font-weight: 800;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter {
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 14px;
      padding: 10px 12px;

      color: var(--purple-dark);
      background: rgba(255, 255, 255, 0.86);

      font-size: 11px;
      font-weight: 900;
    }

    .filter.active {
      color: white;
      background: var(--purple);
    }

    .inventory-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(205px, 1fr));
      gap: 14px;

      margin-top: 18px;
    }

    .item-card {
      position: relative;

      border: 4px solid rgba(255, 255, 255, 0.85);
      border-radius: 23px;
      padding: 16px;

      background: rgba(255, 255, 255, 0.94);

      box-shadow:
        0 12px 26px rgba(62, 66, 117, 0.17);

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .item-card:hover {
      transform: translateY(-5px);

      box-shadow:
        0 18px 32px rgba(62, 66, 117, 0.22);
    }

    .item-card.equipped {
      outline: 4px solid var(--gold);
    }

    .item-icon {
      min-height: 84px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          #f7f5ff,
          #fff9dc
        );

      font-size: 58px;
    }

    .favorite-button {
      position: absolute;
      top: 10px;
      right: 10px;

      width: 36px;
      height: 36px;

      border: 0;
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.92);

      font-size: 20px;
    }

    .quantity {
      position: absolute;
      top: 70px;
      right: 12px;

      min-width: 33px;

      border: 3px solid white;
      border-radius: 999px;
      padding: 5px 7px;

      color: white;
      background: var(--purple);

      font-size: 11px;
      font-weight: 900;
      text-align: center;
    }

    .rarity {
      display: inline-flex;

      margin-top: 12px;
      border-radius: 999px;
      padding: 5px 9px;

      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .rarity.common {
      color: #54606b;
      background: #e7edf2;
    }

    .rarity.uncommon {
      color: #267240;
      background: #d9f6e2;
    }

    .rarity.rare {
      color: #205aa6;
      background: #dcecff;
    }

    .rarity.epic {
      color: #6b2ba7;
      background: #efddff;
    }

    .rarity.legendary {
      color: #a15d00;
      background: #fff0bf;
    }

    .item-name {
      margin: 9px 0 0;

      color: var(--purple-dark);
      font-size: 16px;
      font-weight: 900;
    }

    .item-type {
      margin-top: 3px;

      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: capitalize;
    }

    .item-description {
      min-height: 38px;
      margin: 8px 0 0;

      color: #707694;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.45;
    }

    .item-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;

      margin-top: 12px;
    }

    .item-button {
      border: 0;
      border-radius: 11px;
      padding: 9px;

      color: var(--purple-dark);
      background: var(--purple-light);

      font-size: 10px;
      font-weight: 900;
    }

    .item-button.primary {
      color: white;
      background: var(--purple);
    }

    .empty,
    .loading {
      grid-column: 1 / -1;

      border: 4px dashed rgba(255, 255, 255, 0.85);
      border-radius: 24px;
      padding: 40px 20px;

      color: var(--purple-dark);
      background: rgba(255, 255, 255, 0.75);

      font-size: 14px;
      font-weight: 900;
      text-align: center;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 1000;

      display: none;
      max-width: 350px;

      border: 3px solid white;
      border-radius: 16px;
      padding: 13px 15px;

      color: white;
      background: var(--purple-dark);

      box-shadow:
        0 13px 30px rgba(37, 34, 85, 0.28);

      font-size: 12px;
      font-weight: 900;
    }

    .toast.visible {
      display: block;
    }

    @media (max-width: 780px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
      }

      .top-actions {
        flex-direction: column;
      }
    }

    @media (max-width: 480px) {
      .hero-card {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats-card {
        grid-template-columns: 1fr 1fr;
      }

      .inventory-grid {
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      .item-card {
        padding: 10px;
      }

      .item-icon {
        min-height: 68px;
        font-size: 45px;
      }

      .item-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="topbar">

      <div class="brand">

        <div class="brand-icon">
          🎒
        </div>

        <div>
          <h1>My Backpack</h1>

          <p id="childName">
            Loading adventurer...
          </p>
        </div>

      </div>

      <div class="top-actions">

        <button
          id="mapButton"
          class="top-button"
          type="button">
          World Map
        </button>

        <button
          id="gameButton"
          class="top-button primary"
          type="button">
          Return to Game
        </button>

      </div>

    </header>

    <section class="hero">

      <article class="hero-card">

        <div class="backpack">
          🎒
        </div>

        <div>
          <h2>
            Adventure Inventory
          </h2>

          <p class="hero-copy">
            Keep books, food, keys, rewards, pet supplies,
            decorations, and special treasures collected
            throughout ELCraft.
          </p>
        </div>

      </article>

      <article class="stats-card">

        <div class="stat">

          <div
            id="totalItems"
            class="stat-value">
            0
          </div>

          <div class="stat-label">
            Unique Items
          </div>

        </div>

        <div class="stat">

          <div
            id="totalQuantity"
            class="stat-value">
            0
          </div>

          <div class="stat-label">
            Total Pieces
          </div>

        </div>

        <div class="stat">

          <div
            id="favoriteCount"
            class="stat-value">
            0
          </div>

          <div class="stat-label">
            Favorites
          </div>

        </div>

        <div class="stat">

          <div
            id="rareCount"
            class="stat-value">
            0
          </div>

          <div class="stat-label">
            Rare Treasures
          </div>

        </div>

      </article>

    </section>

    <section class="toolbar">

      <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="Search your backpack..."
        autocomplete="off">

      <div
        id="filters"
        class="filters">

        <button
          class="filter active"
          type="button"
          data-type="all">
          All
        </button>

        <button
          class="filter"
          type="button"
          data-type="book">
          📚 Books
        </button>

        <button
          class="filter"
          type="button"
          data-type="food">
          🍎 Food
        </button>

        <button
          class="filter"
          type="button"
          data-type="pet">
          🐶 Pets
        </button>

        <button
          class="filter"
          type="button"
          data-type="key">
          🗝️ Keys
        </button>

        <button
          class="filter"
          type="button"
          data-type="reward">
          🎁 Rewards
        </button>

        <button
          class="filter"
          type="button"
          data-type="decoration">
          🪴 Decor
        </button>

      </div>

    </section>

    <section
      id="inventoryGrid"
      class="inventory-grid">

      <div class="loading">
        Opening your backpack...
      </div>

    </section>

  </main>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite">
  </div>

  <script type="module">
    import {
      getSelectedChildId,
      loadInventory,
      useInventoryItem,
      toggleFavorite,
      toggleEquipped
    } from "./inventory.js";

    import { supabase } from "./supabase-client.js";

    const childId =
      getSelectedChildId();

    const childName =
      document.getElementById("childName");

    const inventoryGrid =
      document.getElementById("inventoryGrid");

    const searchInput =
      document.getElementById("searchInput");

    const filters =
      document.getElementById("filters");

    const totalItems =
      document.getElementById("totalItems");

    const totalQuantity =
      document.getElementById("totalQuantity");

    const favoriteCount =
      document.getElementById("favoriteCount");

    const rareCount =
      document.getElementById("rareCount");

    const toast =
      document.getElementById("toast");

    let inventory = [];
    let activeType = "all";
    let searchTerm = "";

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("visible");

      window.setTimeout(
        () => {
          toast.classList.remove("visible");
        },
        2800
      );
    }

    function updateStats() {
      totalItems.textContent =
        String(inventory.length);

      totalQuantity.textContent =
        String(
          inventory.reduce(
            (total, item) => {
              return (
                total +
                Number(item.quantity || 0)
              );
            },
            0
          )
        );

      favoriteCount.textContent =
        String(
          inventory.filter(
            item => item.is_favorite
          ).length
        );

      rareCount.textContent =
        String(
          inventory.filter(
            item =>
              item.rarity === "rare" ||
              item.rarity === "epic" ||
              item.rarity === "legendary"
          ).length
        );
    }

    function filteredInventory() {
      return inventory.filter(item => {
        const matchesType =
          activeType === "all" ||
          item.item_type === activeType;

        const haystack =
          [
            item.item_name,
            item.item_type,
            item.description,
            item.rarity
          ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();

        const matchesSearch =
          !searchTerm ||
          haystack.includes(
            searchTerm.toLowerCase()
          );

        return (
          matchesType &&
          matchesSearch
        );
      });
    }

    function renderInventory() {
      inventoryGrid.replaceChildren();

      const visibleItems =
        filteredInventory();

      if (!visibleItems.length) {
        const empty =
          document.createElement("div");

        empty.className = "empty";

        empty.textContent =
          inventory.length
            ? "No items match this filter."
            : "Your backpack is empty. Explore ELCraft to discover your first treasure!";

        inventoryGrid.appendChild(empty);

        updateStats();

        return;
      }

      visibleItems.forEach(item => {
        inventoryGrid.appendChild(
          createItemCard(item)
        );
      });

      updateStats();
    }

    function createItemCard(item) {
      const card =
        document.createElement("article");

      card.className =
        `item-card${
          item.is_equipped
            ? " equipped"
            : ""
        }`;

      const icon =
        document.createElement("div");

      icon.className =
        "item-icon";

      icon.textContent =
        item.item_icon || "🎒";

      const favorite =
        document.createElement("button");

      favorite.className =
        "favorite-button";

      favorite.type =
        "button";

      favorite.title =
        item.is_favorite
          ? "Remove from favorites"
          : "Add to favorites";

      favorite.textContent =
        item.is_favorite
          ? "⭐"
          : "☆";

      favorite.addEventListener(
        "click",
        async () => {
          favorite.disabled = true;

          try {
            const updated =
              await toggleFavorite(
                item.id,
                !item.is_favorite
              );

            inventory =
              inventory.map(existing =>
                existing.id === item.id
                  ? updated
                  : existing
              );

            renderInventory();

            showToast(
              updated.is_favorite
                ? "Added to favorites!"
                : "Removed from favorites."
            );
          } catch (error) {
            favorite.disabled = false;

            showToast(
              error.message ||
              "Unable to update favorite."
            );
          }
        }
      );

      const quantity =
        document.createElement("div");

      quantity.className =
        "quantity";

      quantity.textContent =
        `×${Number(item.quantity || 0)}`;

      const rarity =
        document.createElement("div");

      rarity.className =
        `rarity ${item.rarity || "common"}`;

      rarity.textContent =
        item.rarity || "common";

      const name =
        document.createElement("h3");

      name.className =
        "item-name";

      name.textContent =
        item.item_name;

      const type =
        document.createElement("div");

      type.className =
        "item-type";

      type.textContent =
        item.item_type || "general";

      const description =
        document.createElement("p");

      description.className =
        "item-description";

      description.textContent =
        item.description ||
        "A special ELCraft item.";

      const actions =
        document.createElement("div");

      actions.className =
        "item-actions";

      const equipButton =
        document.createElement("button");

      equipButton.className =
        "item-button";

      equipButton.type =
        "button";

      equipButton.textContent =
        item.is_equipped
          ? "Unequip"
          : "Equip";

      equipButton.addEventListener(
        "click",
        async () => {
          equipButton.disabled = true;

          try {
            const updated =
              await toggleEquipped(
                item.id,
                !item.is_equipped
              );

            inventory =
              inventory.map(existing =>
                existing.id === item.id
                  ? updated
                  : existing
              );

            renderInventory();

            showToast(
              updated.is_equipped
                ? `${updated.item_name} equipped!`
                : `${updated.item_name} unequipped.`
            );
          } catch (error) {
            equipButton.disabled = false;

            showToast(
              error.message ||
              "Unable to update item."
            );
          }
        }
      );

      const useButton =
        document.createElement("button");

      useButton.className =
        "item-button primary";

      useButton.type =
        "button";

      useButton.textContent =
        "Use One";

      useButton.addEventListener(
        "click",
        async () => {
          useButton.disabled = true;

          try {
            const updated =
              await useInventoryItem(
                item.id,
                1
              );

            inventory =
              inventory
                .map(existing =>
                  existing.id === item.id
                    ? updated
                    : existing
                )
                .filter(
                  existing =>
                    Number(
                      existing.quantity || 0
                    ) > 0
                );

            renderInventory();

            showToast(
              `Used one ${item.item_name}.`
            );
          } catch (error) {
            useButton.disabled = false;

            showToast(
              error.message ||
              "Unable to use item."
            );
          }
        }
      );

      actions.append(
        equipButton,
        useButton
      );

      card.append(
        icon,
        favorite,
        quantity,
        rarity,
        name,
        type,
        description,
        actions
      );

      return card;
    }

    async function loadChildName() {
      if (!childId) {
        childName.textContent =
          "No child selected";

        return;
      }

      const {
        data,
        error
      } = await supabase
        .from("child_profiles")
        .select("display_name")
        .eq("id", childId)
        .single();

      if (!error && data) {
        childName.textContent =
          `${data.display_name || "Adventurer"}'s Backpack`;
      }
    }

    async function initialize() {
      if (!childId) {
        inventoryGrid.innerHTML =
          '<div class="empty">Choose a child profile before opening the backpack.</div>';

        childName.textContent =
          "No child selected";

        return;
      }

      await loadChildName();

      const {
        data,
        error
      } = await loadInventory(
        childId
      );

      if (error) {
        inventoryGrid.innerHTML =
          `<div class="empty">${
            error.message ||
            "Unable to load the backpack."
          }</div>`;

        return;
      }

      inventory = data;

      renderInventory();
    }

    searchInput.addEventListener(
      "input",
      event => {
        searchTerm =
          event.target.value.trim();

        renderInventory();
      }
    );

    filters.addEventListener(
      "click",
      event => {
        const button =
          event.target.closest(
            "[data-type]"
          );

        if (!button) {
          return;
        }

        activeType =
          button.dataset.type;

        filters
          .querySelectorAll(
            "[data-type]"
          )
          .forEach(filter => {
            filter.classList.toggle(
              "active",
              filter === button
            );
          });

        renderInventory();
      }
    );

    document
      .getElementById("mapButton")
      .addEventListener(
        "click",
        () => {
          window.location.href =
            "world-map.html";
        }
      );

    document
      .getElementById("gameButton")
      .addEventListener(
        "click",
        () => {
          window.location.href =
            "index.html";
        }
      );

    initialize();
  </script>

  <script
    type="module"
    src="notification-bell.js">
  </script>

  <script
    type="module"
    src="parent-gate.js">
  </script>
</body>
</html>
